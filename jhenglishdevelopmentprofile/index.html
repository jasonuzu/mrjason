<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GCGS Junior High English Proficiency Development Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ══════════════════════════════════════════════════════════════
   "SCALE" — visual system for the GCGS English Proficiency Profile
   Every measurement is drawn on a ruler: navy marks the student,
   gold marks a threshold. A deep-navy rail anchors the product;
   the working surface stays quiet so the numbers carry the page.
   ══════════════════════════════════════════════════════════════ */

:root {
  --surface:    #F1F4F6;
  --panel:      #FFFFFF;
  --panel-sunk: #F7F9FA;
  --panel-head: #EFF3F5;
  --ink:        #101B24;
  --muted:      #576874;
  --faint:      #8B99A3;
  --rule:       #E1E7EA;
  --rule-firm:  #C6D1D6;
  --mark:       #12466E;
  --mark-hi:    #0C3353;
  --mark-soft:  #E8F0F7;
  --target:     #9C6E12;
  --target-hi:  #D9A83E;
  --target-soft:#FAF2DF;
  --met:        #1C6A4C;
  --met-soft:   #E5F1EA;
  --near:       #96630D;
  --near-soft:  #FAF0DC;
  --short:      #A03B2A;
  --short-soft: #F9EAE5;
  --g6:         #12466E;
  --g7:         #1C6A4C;
  --g8:         #5F3A6E;
  --rail-bg:    #10293D;
  --rail-deep:  #0A1E2E;
  --rail-ink:   #EDF2F5;
  --rail-muted: #A4B7C4;
  --rail-faint: #7E94A3;
  --rail-line:  rgba(255,255,255,.09);
  --shadow-sm:  0 1px 2px rgba(16,27,36,.05);
  --shadow-md:  0 1px 2px rgba(16,27,36,.06), 0 10px 28px rgba(16,27,36,.08);
  --r:          8px;
  --rail:       246px;

  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }

html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--surface);
  color: var(--ink);
  font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 14px;
  line-height: 1.55;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
::selection { background: #C9DCEC; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.018em; }
h1 { font-size: 25px; line-height: 1.15; }
a { color: var(--mark); }
:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; border-radius: 3px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Serif is reserved for words a person wrote. */
.prose, .notes-textarea, .post-content, .sub-note, .gb-sub, .focus-label small,
.empty-state p, .no-posts-state, .test-empty-state, .info-callout, .bm-req {
  font-family: Newsreader, Georgia, "Times New Roman", serif;
}

/* ── Shell ───────────────────────────────────────────────────── */
#app { min-height: 100vh; }
.shell { display: flex; align-items: flex-start; min-height: 100vh; }

/* Deep-navy rail: the one strong surface on screen */
.rail {
  position: sticky; top: 0; flex: 0 0 var(--rail); width: var(--rail);
  height: 100vh; background: linear-gradient(180deg, var(--rail-bg) 0%, var(--rail-deep) 100%);
  display: flex; flex-direction: column; padding: 26px 0 0;
  color: var(--rail-ink);
}
.brand { padding: 0 22px 24px; cursor: pointer; position: relative; }
.brand::after {
  content: ""; position: absolute; left: 22px; bottom: 14px;
  width: 34px; height: 2px; background: var(--target-hi); border-radius: 1px;
}
.brand-company { display: block; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--rail-faint); font-weight: 600; }
.brand-mark { display: block; font-size: 17.5px; font-weight: 600; line-height: 1.2; margin-top: 6px; color: var(--rail-ink); letter-spacing: -0.01em; }
.brand-sub { display: block; font-size: 12.5px; color: var(--rail-muted); margin-top: 1px; }
.rail-nav { display: flex; flex-direction: column; padding: 6px 12px 0; gap: 2px; }
.rail-nav a {
  position: relative; display: block; padding: 8px 12px; border-radius: 6px;
  font-size: 13.5px; font-weight: 500; color: var(--rail-muted); text-decoration: none; cursor: pointer;
  transition: background .12s, color .12s;
}
.rail-nav a:hover { background: rgba(255,255,255,.06); color: var(--rail-ink); }
.rail-nav a.on { background: rgba(255,255,255,.1); color: #FFFFFF; font-weight: 600; }
.rail-nav a.on::before {
  content: ""; position: absolute; left: -12px; top: 7px; bottom: 7px;
  width: 3px; border-radius: 0 2px 2px 0; background: var(--target-hi);
}
.rail-head {
  padding: 26px 22px 8px; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--rail-faint); font-weight: 600;
}
.rail-classes { padding: 0 12px; overflow-y: auto; flex: 1; }
.rail-classes::-webkit-scrollbar { width: 8px; }
.rail-classes::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 4px; }
.rail-classes a {
  display: flex; justify-content: space-between; gap: 8px; padding: 7px 12px;
  border-radius: 6px; font-size: 13px; color: var(--rail-muted); text-decoration: none; cursor: pointer;
  transition: background .12s, color .12s;
}
.rail-classes a span:last-child { color: var(--rail-faint); font-size: 12px; }
.rail-classes a:hover { background: rgba(255,255,255,.06); color: var(--rail-ink); }
.rail-classes a.on { background: rgba(255,255,255,.1); color: #FFFFFF; font-weight: 600; }
.rail-classes a.on span:last-child { color: var(--rail-muted); }
.rail-foot { border-top: 1px solid var(--rail-line); padding: 14px 22px 16px; font-size: 12.5px; color: var(--rail-muted); }

.content { flex: 1; min-width: 0; padding: 34px 38px 80px; }
.wrap { max-width: 1560px; }
.wrap-narrow { max-width: 660px; }

/* ── Connection + account ────────────────────────────────────── */
.db-banner { display: flex; flex-direction: column; gap: 7px; }
.db-status { display: flex; align-items: center; gap: 8px; color: var(--rail-muted); font-size: 12.5px; }
.db-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--rail-faint); flex: 0 0 auto; }
.db-banner.connected .db-dot { background: #4CC38A; box-shadow: 0 0 0 3px rgba(76,195,138,.18); }
.db-banner.error .db-dot { background: #F0766A; box-shadow: 0 0 0 3px rgba(240,118,106,.18); }
.db-banner a { cursor: pointer; text-decoration: none; color: var(--rail-ink); }
.db-banner a:hover { text-decoration: underline; }
.user-pill { color: var(--rail-muted); word-break: break-all; font-size: 12px; }
.user-pill a { cursor: pointer; margin-left: 4px; }

/* ── Page headings ───────────────────────────────────────────── */
.page-head { margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--rule); }
.page-sub { color: var(--muted); font-size: 13.5px; margin-top: 7px; }
.report-header { margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--rule); }
.report-title { font-family: Newsreader, Georgia, serif; font-size: 34px; font-weight: 600; letter-spacing: -0.01em; }
.report-eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--target); font-weight: 600; margin-bottom: 6px; }
.report-meta { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; font-size: 13px; color: var(--muted); margin-top: 10px; }

/* ── Panels ──────────────────────────────────────────────────── */
.card, .section-block, .req-card, .group-box, .kpi, .focus-cat, .bm-card, .test-card,
.tracker-wrap, .co-wrap {
  background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r);
}
.card, .section-block, .req-card { padding: 24px 26px; margin-bottom: 18px; box-shadow: var(--shadow-sm); }
.sb-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 18px; }
.sb-title { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
.sb-domain { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.sub-note { font-size: 14px; color: var(--muted); line-height: 1.68; margin: 0 0 16px; max-width: 76ch; }
.info-callout {
  border: 1px solid var(--rule); border-left: 3px solid var(--mark); border-radius: var(--r);
  background: var(--panel-sunk); padding: 13px 16px; font-size: 14px; line-height: 1.62;
}
.empty-state {
  background: var(--panel); border: 1px dashed var(--rule-firm); border-radius: var(--r);
  padding: 60px 30px; text-align: center;
}
.no-posts-state, .test-empty-state {
  padding: 20px; border: 1px dashed var(--rule-firm); border-radius: var(--r);
  color: var(--muted); font-size: 14.5px; background: var(--panel-sunk);
}

/* ── Buttons ─────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 7px; padding: 8px 16px;
  border-radius: 6px; border: 1px solid var(--rule-firm); background: var(--panel);
  color: var(--ink); font-family: inherit; font-size: 13px; font-weight: 500; letter-spacing: .01em;
  cursor: pointer; text-decoration: none; white-space: nowrap;
  box-shadow: var(--shadow-sm); transition: background .12s, border-color .12s, color .12s, box-shadow .12s;
}
.btn:hover { border-color: var(--mark); color: var(--mark); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--mark); border-color: var(--mark); color: #fff; box-shadow: 0 1px 2px rgba(12,51,83,.28); }
.btn-primary:hover { background: var(--mark-hi); border-color: var(--mark-hi); color: #fff; }
.btn-ghost { background: var(--panel); }
.btn-danger-ghost { color: var(--short); }
.btn-danger-ghost:hover { border-color: var(--short); color: var(--short); }
.btn-sm { padding: 5px 11px; font-size: 12.5px; box-shadow: none; }
.btn-block { width: 100%; justify-content: center; padding: 10px 16px; font-size: 13.5px; }
.btn:disabled { opacity: .55; cursor: default; }

/* ── Fields ──────────────────────────────────────────────────── */
.field-group { margin-bottom: 18px; }
.field-label {
  display: block; font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 7px;
}
.field-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
input[type=text], input[type=email], input[type=password], input[type=number],
input[type=date], input[type=url], select, textarea {
  width: 100%; padding: 8px 11px; border: 1px solid var(--rule-firm); border-radius: 6px;
  background: var(--panel); color: var(--ink); font-family: inherit; font-size: 13.5px;
  outline: none; font-variant-numeric: tabular-nums;
  transition: border-color .12s, box-shadow .12s;
}
input::placeholder, textarea::placeholder { color: var(--faint); }
input:focus, select:focus, textarea:focus { border-color: var(--mark); box-shadow: 0 0 0 3px var(--mark-soft); }
textarea { min-height: 96px; resize: vertical; line-height: 1.6; }
.notes-textarea { min-height: 108px; font-size: 15px; }
.mono { font-variant-numeric: tabular-nums; letter-spacing: .03em; }
.file-input-wrap { border: 1px dashed var(--rule-firm); border-radius: var(--r); background: var(--panel-sunk); }
.action-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--rule); }
.form-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }

.grade-options { display: flex; gap: 8px; }
.grade-opt {
  width: 46px; height: 38px; display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--rule-firm); border-radius: 6px; cursor: pointer; font-weight: 600;
  background: var(--panel); box-shadow: var(--shadow-sm); transition: border-color .12s, background .12s, color .12s;
}
.grade-opt:hover { border-color: var(--mark); color: var(--mark); }
.grade-opt.selected { background: var(--mark); border-color: var(--mark); color: #fff; }

.inline-check { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; font-size: 13.5px; user-select: none; }
.inline-check .box {
  width: 18px; height: 18px; border: 1px solid var(--rule-firm); border-radius: 5px;
  display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; background: var(--panel);
  transition: background .12s, border-color .12s;
}
.inline-check.on .box { background: var(--mark); border-color: var(--mark); }

/* ── Tabs ────────────────────────────────────────────────────── */
.tabs-row { display: flex; gap: 24px; border-bottom: 1px solid var(--rule); margin-bottom: 26px; flex-wrap: wrap; }
.tab-btn {
  padding: 0 0 12px; background: none; border: none; border-bottom: 2px solid transparent;
  font-family: inherit; font-size: 13.5px; font-weight: 500; color: var(--muted); cursor: pointer; margin-bottom: -1px;
  transition: color .12s, border-color .12s;
}
.tab-btn:hover { color: var(--ink); }
.tab-btn.active { color: var(--mark); border-bottom-color: var(--mark); font-weight: 600; }

/* ── THE SCALE ───────────────────────────────────────────────── */
.scale { margin: 14px 0 6px; }
.scale-track {
  position: relative; height: 36px; margin-top: 26px; background: var(--panel-sunk);
  border: 1px solid var(--rule-firm); border-radius: 6px;
  box-shadow: inset 0 1px 2px rgba(16,27,36,.04);
}
.scale-fill { position: absolute; inset: 0 auto 0 0; background: var(--mark-soft); border-radius: 5px 0 0 5px; border-right: 1px solid rgba(18,70,110,.25); }
.scale-fill.met { background: var(--met-soft); border-right-color: rgba(28,106,76,.3); }
.scale-fill.near { background: var(--near-soft); border-right-color: rgba(150,99,13,.3); }
.scale-fill.short { background: var(--short-soft); border-right-color: rgba(160,59,42,.3); }
.scale-tick { position: absolute; top: 6px; bottom: 6px; width: 1px; background: var(--rule); }
.scale-notch { position: absolute; top: -1px; bottom: -1px; width: 2px; background: var(--target); }
.scale-notch::after {
  content: attr(data-label); position: absolute; left: 50%; top: -21px;
  transform: translateX(-50%); font-size: 11px; letter-spacing: .02em; color: var(--target);
  white-space: nowrap; font-weight: 700;
}
.scale-mark {
  position: absolute; top: 50%; width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px;
  background: var(--mark); border: 2px solid var(--panel); border-radius: 50%;
  box-shadow: 0 1px 3px rgba(12,51,83,.35);
}
.scale-mark.many { width: 10px; height: 10px; margin: -5px 0 0 -5px; }
.scale-value {
  position: absolute; top: 50%; transform: translate(-50%, -50%); background: var(--mark); color: #fff;
  font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 4px; white-space: nowrap;
  box-shadow: 0 2px 6px rgba(12,51,83,.3);
}
.scale-foot { display: flex; justify-content: space-between; font-size: 11px; color: var(--faint); margin-top: 7px; }
.scale-caption { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.scale-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.scale-head .lede { font-size: 14px; font-weight: 600; }
.scale-head .read { font-size: 12.5px; color: var(--muted); }

/* ── Requirements ────────────────────────────────────────────── */
.req-head { display: flex; justify-content: space-between; align-items: baseline; gap: 18px; flex-wrap: wrap; }
.req-title { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
.req-count { font-size: 13.5px; color: var(--muted); }
.req-count strong { font-size: 20px; color: var(--ink); font-weight: 600; letter-spacing: -0.01em; }
.meter {
  position: relative; height: 24px; margin-top: 14px; background: var(--panel-sunk);
  border: 1px solid var(--rule-firm); border-radius: 5px;
  box-shadow: inset 0 1px 2px rgba(16,27,36,.04);
}
.meter-fill { position: absolute; inset: 0 auto 0 0; background: var(--mark-soft); border-right: 2px solid var(--mark); border-radius: 4px 0 0 4px; }
.meter-fill.low { background: var(--short-soft); border-right-color: var(--short); }
.meter-fill.done { background: var(--met-soft); border-right-color: var(--met); }
.meter-min { position: absolute; top: -1px; bottom: -1px; width: 2px; background: var(--target); }
.meter-note { font-size: 12.5px; color: var(--muted); margin-top: 7px; }

/* ── Student rows ────────────────────────────────────────────── */
.class-group { margin-bottom: 36px; }
.class-group.collapsed { margin-bottom: 12px; }
.class-group-header {
  display: flex; justify-content: space-between; align-items: center; gap: 16px;
  flex-wrap: wrap; margin-bottom: 12px;
}
.class-group.collapsed .class-group-header {
  margin-bottom: 0; background: var(--panel); border: 1px solid var(--rule);
  border-radius: var(--r); padding: 12px 18px; box-shadow: var(--shadow-sm);
}
.class-toggle {
  display: flex; align-items: baseline; gap: 11px; background: none; border: none;
  padding: 0; font-family: inherit; color: inherit; cursor: pointer; text-align: left;
}
.class-toggle .caret { font-size: 12px; color: var(--faint); width: 11px; }
.class-toggle:hover .class-group-name { color: var(--mark); }
.class-group-name { font-size: 19px; font-weight: 600; letter-spacing: -0.015em; }
.class-group.collapsed .class-group-name { font-size: 16px; }
.class-group-count {
  font-size: 11.5px; font-weight: 600; color: var(--muted); background: var(--panel-sunk);
  border: 1px solid var(--rule); border-radius: 999px; padding: 1px 9px;
}
.class-group-meta { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.meta-warn { color: var(--near); font-weight: 600; }
.record-card {
  display: flex; align-items: center; gap: 14px; background: var(--panel);
  border: 1px solid var(--rule); border-top: none; padding: 13px 18px; cursor: pointer;
  transition: background .12s;
}
.class-group .record-card:first-of-type, .wrap > .record-card:first-of-type {
  border-top: 1px solid var(--rule); border-radius: var(--r) var(--r) 0 0;
}
.class-group .record-card:last-of-type, .wrap > .record-card:last-of-type { border-radius: 0 0 var(--r) var(--r); }
.record-card:hover { background: var(--mark-soft); }
.record-info { flex: 1; min-width: 0; }
.record-name { font-size: 15px; font-weight: 600; letter-spacing: -0.005em; }
.record-meta { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.record-arrow { color: var(--faint); font-size: 18px; transition: transform .12s, color .12s; }
.record-card:hover .record-arrow { transform: translateX(3px); color: var(--mark); }

.grade-chip { display: inline-block; padding: 1px 9px; border-radius: 5px; font-size: 11.5px; font-weight: 600; letter-spacing: .02em; background: var(--panel-sunk); border: 1px solid var(--rule); }
.grade-chip.g6 { color: var(--g6); border-color: #C2D3E2; background: #EDF3F9; }
.grade-chip.g7 { color: var(--g7); border-color: #BCD6C9; background: #EAF3EE; }
.grade-chip.g8 { color: var(--g8); border-color: #D4C2DC; background: #F4EFF7; }

/* ── Data tables ─────────────────────────────────────────────── */
.tracker-wrap, .co-wrap { overflow: auto; max-height: calc(100vh - 160px); box-shadow: var(--shadow-sm); }
.tracker-wrap::-webkit-scrollbar, .co-wrap::-webkit-scrollbar { width: 10px; height: 10px; }
.tracker-wrap::-webkit-scrollbar-thumb, .co-wrap::-webkit-scrollbar-thumb { background: var(--rule-firm); border-radius: 5px; border: 2px solid var(--panel); }
table.tracker, table.co { border-collapse: separate; border-spacing: 0; width: 100%; }
table.tracker { min-width: 700px; font-size: 13px; }
table.co { font-size: 13px; }
table.tracker th, table.tracker td, table.co th, table.co td {
  border-bottom: 1px solid var(--rule); padding: 8px 11px; text-align: left; vertical-align: middle;
}
table.tracker th, table.tracker td { border-right: 1px solid var(--rule); }
table.tracker thead th, table.co thead th {
  background: var(--panel-head); font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); white-space: nowrap; position: sticky; top: 0; z-index: 3;
  border-bottom: 1px solid var(--rule-firm);
}
table.tracker th.rowhead {
  width: 232px; font-weight: 500; font-size: 13px; letter-spacing: 0; text-transform: none; color: var(--ink);
  background: var(--panel-head); white-space: normal; position: sticky; left: 0; z-index: 2;
}
table.tracker th.gcol-6 { color: var(--g6); }
table.tracker th.gcol-7 { color: var(--g7); }
table.tracker th.gcol-8 { color: var(--g8); }
table.tracker td.locked {
  background: repeating-linear-gradient(135deg, #F5F7F7, #F5F7F7 5px, #EDF1F1 5px, #EDF1F1 10px);
  color: var(--faint); text-align: center;
}
table.tracker tr.band th, table.tracker tr.band td { background: var(--panel-head); font-weight: 600; font-size: 12.5px; color: var(--ink); }
table.tracker input, table.tracker select, table.co input, table.co select {
  width: 100%; border: 1px solid transparent; background: transparent; padding: 4px 6px;

const local = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },

  del(k){ try{ localStorage.removeItem(k); }catch(e){} },

    try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.indexOf(prefix)===0) out.push(k); } }catch(e){}

};

/* Student rows keep flat identity columns for querying and a single
   JSONB `data` column for everything the profile tracks. */
function recToRow(rec){
  const data = {};
  Object.keys(rec).forEach(k=>{
    if(['id','name','chineseName','className','grade','createdAt','updatedAt'].indexOf(k)>=0) return;
    if(k.charAt(0)==='_') return;
    data[k] = rec[k];
  });
  const row = {
    student_id: rec.id,
    name: rec.name || '',
    chinese_name: rec.chineseName || '',
    class_name: rec.className || '',
    grade: Number(rec.grade) || 6,
    data: data,
    updated_at: new Date(rec.updatedAt || Date.now()).toISOString(),
    created_at: new Date(rec.createdAt || Date.now()).toISOString()
  };
  if(state.userId) row.owner_id = state.userId;
  return row;
}
function rowToRec(row){
  const rec = Object.assign({}, row.data || {});
  rec.id = row.student_id;
  rec.name = row.name || '';
  rec.chineseName = row.chinese_name || '';
  rec.className = row.class_name || '';
  rec.grade = Number(row.grade) || 6;
  rec.createdAt = row.created_at ? new Date(row.created_at).getTime() : Date.now();
  rec.updatedAt = row.updated_at ? new Date(row.updated_at).getTime() : Date.now();
  return migrate(rec);
}

/* Debounced writer so typing in the tracker does not hammer the API. */
const writer = {
  dirty:{}, timers:{},
  queue(rec){
    rec.updatedAt = Date.now();
    try{ local.set(LS_PREFIX + rec.id, JSON.stringify(rec)); }catch(e){}
    if(!db.isConnected()) return;
    writer.dirty[rec.id] = rec;
    clearTimeout(writer.timers[rec.id]);
    writer.timers[rec.id] = setTimeout(()=>writer.send(rec.id), 700);
  },
  send(id){
    const rec = writer.dirty[id];
    if(!rec || !db.isConnected()) return;
    delete writer.dirty[id];
    db.client.from('gcgs_students').upsert(recToRow(rec), { onConflict:'student_id' })
      .then(({error})=>{ if(error) console.error('Save failed:', error.message); });
  },
  flush(){ Object.keys(writer.dirty).forEach(id => writer.send(id)); }
};

function saveStudent(rec){ writer.queue(rec); }

function generateUserId(){

  for(let i=0;i<4;i++) s += n[Math.floor(Math.random()*n.length)];

  const words=['tiger','river','maple','cloud','stone','amber','light','north','field','coral','olive','piano'];

/* Defensive: records written by earlier versions, imports, or other
   apps must never crash a render because a key is missing. */
function migrate(rec){
  rec = rec || {};
  rec.grade = Number(rec.grade) || 6;
  if(GRADES.indexOf(rec.grade) < 0) rec.grade = 6;
  rec.ixl = Object.assign({ username:'', password:'', url:'https://www.ixl.com/signin/gcgs' }, rec.ixl||{});
  rec.tracker = rec.tracker || {};
  GRADES.forEach(g=>{
    const t = Object.assign(blankGradeTracker(), rec.tracker[g] || {});
    t.think = Object.assign({ s1Goal:'', s1Score:'', s2Goal:'', s2Score:'' }, t.think||{});
    t.pep   = Object.assign({ s1Goal:'', s1Grade:'', s2Goal:'', s2Grade:'' }, t.pep||{});
    t.kpf   = Object.assign({ exam:'', goal:'', score:'' }, t.kpf||{});
    rec.tracker[g] = t;
  });
  ['tests','petFocus','goals','books','songs','essays','presentations','vocab','posts'].forEach(k=>{
    if(!Array.isArray(rec[k])) rec[k] = [];
  });
  ['info','homeInfo','tutorInfo','focusNote','name','chineseName','className'].forEach(k=>{
    if(typeof rec[k] !== 'string') rec[k] = rec[k]==null ? '' : String(rec[k]);
  });
  rec.hasTutor = !!rec.hasTutor;
  if(!rec.userId) rec.userId = generateUserId();
  if(!rec.password) rec.password = generatePassword();
  rec.tests.forEach(t=>{
    t.skills = Object.assign({reading:'',writing:'',listening:'',speaking:''}, t.skills||{});
    t.goalSkills = Object.assign({reading:'',writing:'',listening:'',speaking:''}, t.goalSkills||{});

  return rec;
}

/* ══════════════════════════════════════════════════════════════
   COMPUTATION
   ══════════════════════════════════════════════════════════════ */

function num(v){ const n = parseFloat(v); return isNaN(n) ? null : n; }

function sumBooks(rec){ return (rec.books||[]).reduce((a,b)=>a + (num(b.words)||0), 0); }
function sumVocab(rec){ return (rec.vocab||[]).reduce((a,b)=>a + (num(b.words)||0), 0); }

function reqProgress(rec, key){
  const meta = REQUIREMENTS.find(r=>r.key===key);
  let value = 0;
  if(key==='reading') value = sumBooks(rec);
  else if(key==='vocab') value = sumVocab(rec);
  else if(key==='songs') value = (rec.songs||[]).length;
  else if(key==='essays') value = (rec.essays||[]).length;
  else if(key==='presentations') value = (rec.presentations||[]).length;
  const pct = meta.min ? Math.min(100, Math.round(value / meta.min * 100)) : 0;
  return { value, pct, min: meta.min, stretch: meta.stretch, met: value >= meta.min, meta };
}

function overallRequirementPct(rec){
  const parts = REQUIREMENTS.map(r => reqProgress(rec, r.key).pct);
  return Math.round(parts.reduce((a,b)=>a+b,0) / parts.length);
}

/* Best recorded result per test type, with per-skill minimum. */
function bestResults(rec){
  const out = {};
  (rec.tests||[]).forEach(t=>{
    const o = num(t.overall);
    if(o===null) return;
    const skillVals = SKILLS.map(s=>num(t.skills[s.key])).filter(v=>v!==null);
    const entry = { overall:o, minSkill: skillVals.length===SKILLS.length ? Math.min.apply(null,skillVals) : null, test:t };
    if(!out[t.type] || o > out[t.type].overall) out[t.type] = entry;
  });
  return out;
}

function benchmarkStatus(rec){
  const trans = BENCHMARKS[transitionForGrade(rec.grade)];
  const best = bestResults(rec);
  if(!trans) return null;
  const tiers = trans.tiers.map(tier=>{
    const met = tier.rules.some(rule=>{
      const b = best[rule.test];
      if(!b) return false;
      if(b.overall < rule.min) return false;
      if(rule.allSections){
        if(b.minSkill === null) return false;
        if(b.minSkill < rule.min) return false;
      }
      return true;
    });
    return Object.assign({}, tier, { met });
  });
  let highest = null;
  ['aplus','a','all'].forEach(k=>{ if(!highest){ const t = tiers.find(x=>x.key===k && x.met); if(t) highest = t; } });
  return { label: trans.label, tiers, highest, best };
}

function speechesDue(rec){
  const done = (rec.presentations||[]).filter(p=>p.type==='3min' && Number(p.grade)===Number(rec.grade)).length;
  return Math.max(0, SPEECHES_PER_GRADE - done);
}

function goalStats(rec){
  const g = rec.goals||[];
  const done = g.filter(x=>x.done).length;
  return { total:g.length, done, pct: g.length ? Math.round(done/g.length*100) : 0 };
}

function testGoalGaps(rec){
  const gaps = [];
  (rec.tests||[]).forEach(t=>{
    const goal = num(t.goalOverall), score = num(t.overall);
    if(goal !== null && (score === null || score < goal)){
      gaps.push({ type:t.type, goal, score });
    }
    SKILLS.forEach(s=>{
      const sg = num(t.goalSkills[s.key]), ss = num(t.skills[s.key]);
      if(sg !== null && (ss === null || ss < sg)) gaps.push({ type:t.type + ' ' + s.label, goal:sg, score:ss });
    });
  });
  return gaps;
}

function studentsInClass(className){
  return state.students.filter(s => (s.className||'').trim() === (className||'').trim());
}
function getAllClassNames(){
  const set = new Set();
  state.students.forEach(s=>{ if(s.className && s.className.trim()) set.add(s.className.trim()); });
  return Array.from(set).sort((a,b)=>a.localeCompare(b));
}

/* ── Class registry: parent-access key per class ── */
function loadClassRegistry(){
  try{ const raw = local.get(LS_CLASSES); if(raw) return JSON.parse(raw); }catch(e){}
  return {};
}
function saveClassRegistry(reg){ local.set(LS_CLASSES, JSON.stringify(reg)); }
function getOrCreateClassEntry(className){
  const reg = loadClassRegistry();
  if(!reg[className]){
    reg[className] = { classId: generateClassId(className), parentKey: Math.random().toString(36).slice(2,10), createdAt: Date.now() };
    saveClassRegistry(reg);
  }
  return reg[className];
}

function escapeHtml(str){
  return String(str==null?'':str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escapeAttr(str){ return String(str==null?'':str).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
function fmtNum(n){ return Number(n||0).toLocaleString('en-US'); }
function fmtDate(ts){
  if(!ts) return '';
  const d = new Date(ts);
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}
function todayISO(){ return new Date().toISOString().slice(0,10); }

  logFocus:[], logMode:'add', logPost:'', logParentVisible:false,

  parentMode:false,
  authError:'', authBusy:false,
  toast:''
};

function activeStudent(){ return state.students.find(s=>s.id===state.activeId) || null; }

async function init(){
  state.collapsed = loadCollapsed();
  await db.autoConnect();

  const params = new URLSearchParams(location.search);
  if(params.get('parent')){
    state.parentMode = true;
    state.parentClass = params.get('parent');
    state.parentKey = params.get('key') || '';
    state.students = await loadAllStudentsAsync();
    state.settings = await loadSettingsAsync();
    const entry = loadClassRegistry()[state.parentClass];
    state.parentOk = !entry || !entry.parentKey || entry.parentKey === state.parentKey;
    state.view = 'parentRoster';
    render();
    return;
  }

  if(db.isConnected()){
    try{
      const { data:{ session } } = await db.client.auth.getSession();
      if(session && session.user){
        state.userId = session.user.id;
        state.userEmail = session.user.email;
        state.students = await loadAllStudentsAsync();
        state.settings = await loadSettingsAsync();
        state.view = 'dashboard';
      } else {
        state.view = 'login';
      }
    }catch(e){ state.view = 'login'; }
  } else {
    state.students = loadAllStudentsLocal();
    state.settings = loadSettingsLocal();
    state.view = 'dashboard';
  }
  render();

  const commit = ()=>writer.flush();
  window.addEventListener('beforeunload', commit);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') commit(); });
}

function render(opts){
  opts = opts || {};
  const app = document.getElementById('app');
  let body = '';
  switch(state.view){
    case 'loading':      body = `<div class="wrap" style="padding-top:120px;text-align:center;color:var(--muted);">Loading…</div>`; break;
    case 'login':        body = renderAuth('login'); break;
    case 'signup':       body = renderAuth('signup'); break;
    case 'dashboard':    body = renderDashboard(); break;
    case 'newStudent':   body = renderNewStudent(); break;
    case 'bulkImport':   body = renderBulkImport(); break;
    case 'profile':      body = renderProfile(); break;
    case 'classOverview':body = renderClassOverview(); break;
    case 'credentials':  body = renderClassCredentials(); break;
    case 'admin':        body = renderAdmin(); break;
    case 'dbSettings':   body = renderDbSettings(); break;
    case 'parentRoster': body = renderParentRoster(); break;
    case 'parentProfile':body = renderParentProfile(); break;
    default:             body = `<div class="wrap">Unknown view.</div>`;
  }
  if(state.parentMode) app.innerHTML = `<div class="content">${body}</div>`;
  else if(['loading','login','signup'].indexOf(state.view) >= 0) app.innerHTML = body;
  else app.innerHTML = renderShell(body);
  if(!opts.preserveScroll) window.scrollTo(0,0);
}

function parseNameList(text){
  const out = [];
  String(text||'').split(/\r?\n/).forEach(line=>{
    let s = line.trim();
    if(!s) return;
    s = s.replace(/^\d+[\.\)、\s]+/, '').trim();   // drop a leading row number
    if(!s) return;
    const parts = s.split(/[\t,，;]+/).map(p=>p.trim()).filter(Boolean);
    if(!parts.length) return;
    let name = parts[0], chineseName = parts[1] || '';
    // If the first column is Chinese and the second is Latin, swap them.
    if(/[\u4e00-\u9fff]/.test(name) && parts[1] && !/[\u4e00-\u9fff]/.test(parts[1])){
      chineseName = name; name = parts[1];
    }
    out.push({ name, chineseName });
  });
  return out;
}

/* ══════════════════════════════════════════════════════════════
   THE SCALE — the one visual idea the interface is built around.
   Every measurement in this product is a position between a floor
   and a ceiling, with thresholds along the way. Navy marks the
   student; gold marks a threshold they are aiming at.
   ══════════════════════════════════════════════════════════════ */

/* Reporting range for each Cambridge / external test, so a score can
   be placed on a ruler rather than read as a bare number. */
const TEST_RANGE = {
  'KET':{min:100,max:150}, 'PET':{min:120,max:170}, 'FCE':{min:140,max:190},
  'IELTS':{min:0,max:9}, 'TOEFL iBT':{min:0,max:120}, 'TOEFL (new 1–6)':{min:1,max:6},
  'Movers':{min:0,max:15}
};
/* The exam each transition is actually judged on for most students. */
const TRANSITION_TEST = { '5-6':'KET', '6-7':'PET', '7-8':'PET', '8-9':'PET' };

function pos(v, range){ return Math.max(0, Math.min(100, (v - range.min) / (range.max - range.min) * 100)); }

/* marks: [{value, label, title, many}] · notches: [{value, label}] */
function scaleHtml(range, marks, notches, opts){
  opts = opts || {};
  const ticks = [];
  for(let i=1;i<4;i++) ticks.push(`<span class="scale-tick" style="left:${i*25}%"></span>`);
  return `
  <div class="scale">
    ${opts.head ? `<div class="scale-head">${opts.head}</div>` : ''}
    <div class="scale-track">
      ${opts.fill ? `<div class="scale-fill ${opts.fill.state||''}" style="width:${pos(opts.fill.value, range)}%"></div>` : ''}
      ${ticks.join('')}
      ${(notches||[]).map(n=>`<span class="scale-notch" style="left:${pos(n.value, range)}%" data-label="${escapeHtml(n.label)}"></span>`).join('')}
      ${(marks||[]).map(m=> m.showValue
        ? `<span class="scale-value" style="left:${pos(m.value, range)}%" title="${escapeHtml(m.title||'')}">${escapeHtml(String(m.value))}</span>`
        : `<span class="scale-mark ${m.many?'many':''}" style="left:${pos(m.value, range)}%" title="${escapeHtml(m.title||'')}"></span>`).join('')}
    </div>
    <div class="scale-foot"><span>${range.min}</span><span>${range.max}</span></div>
    ${opts.caption ? `<div class="scale-caption">${opts.caption}</div>` : ''}
  </div>`;
}

/* A whole class placed on one ruler: the distribution a teacher wants
   to see before anything else. */
function classScaleHtml(list){
  if(!list.length) return '';
  const grade = Number(list[0].grade) || 6;
  const key = transitionForGrade(grade);
  const trans = BENCHMARKS[key];
  const testKey = TRANSITION_TEST[key] || 'PET';
  const range = TEST_RANGE[testKey];
  if(!trans || !range) return '';

  const marks = [];
  let missing = 0;
  list.forEach(s=>{
    const best = bestResults(s)[testKey];
    if(!best){ missing++; return; }
    marks.push({ value: best.overall, many: list.length > 1, title: (s.name||'') + ' — ' + testKey + ' ' + best.overall });
  });

  const notches = trans.tiers
    .map(t=>{ const r = t.rules.find(x=>x.test===testKey); return r ? { value:r.min, label:t.name.replace(' Class','') + ' ' + r.min } : null; })
    .filter(Boolean);

  const metAll = notches.length ? marks.filter(m=>m.value >= notches[0].value).length : 0;

  return `
  ${scaleHtml(range, marks, notches, {
    head: `<span class="lede">${escapeHtml(testKey)} scores across the class</span>
           <span class="read">${metAll} of ${marks.length} scored at or above the entry threshold</span>`,
    caption: missing ? missing + (missing===1?' student has':' students have') + ' no ' + testKey + ' score recorded yet.' : ''
  })}`;
}

/* ── 5. Three-year English Learner Profile tracker ── */

function profileTracker(rec){
  const cur = Number(rec.grade);
  const cell = (g, path, placeholder, opts) => {
    opts = opts || {};
    const ahead = g > cur;
    // A goal can be set for a grade the student has not started; a result cannot.
    if(ahead && !opts.goal) return `<td class="locked" title="Opens when the student reaches Grade ${g}">—</td>`;
    const cls = opts.goal ? (ahead ? 'goal-cell future-goal' : 'goal-cell') : '';
    const v = trackerValue(rec, g, path);
    if(opts.select){
      return `<td class="${cls}"><select onchange="App.tracker(${g},'${path}', this.value)">
        <option value="">—</option>
        ${opts.select.map(o=>`<option value="${escapeHtml(o)}" ${v===o?'selected':''}>${escapeHtml(o)}</option>`).join('')}
      </select></td>`;
    }
    return `<td class="${cls}"><input type="text" value="${escapeHtml(v)}" placeholder="${placeholder||''}"
      oninput="App.tracker(${g},'${path}', this.value)"></td>`;
  };
  const PEP = ['A+','A','B+','B','C+','C'];
  const KPF = ['KET','PET','FCE'];
  const maxFor = g => g===6 ? '100' : '120';

  return `
  <div class="section-block">
    <div class="sb-head"><div><div class="sb-title">English Learner Profile Tracker</div>
      <div class="sb-domain">Objectives and goals across Grades 6 to 8. Goals can be set ahead; results open as the student moves up.</div></div></div>

    <p class="sub-note">Placement, THINK mid-term and PEP final results sit alongside the goal set for each one, so a target and
      the result it was set against are always read together. KET / PET / FCE benchmarks: KET 150, PET 170, FCE 190.</p>

    <div class="tracker-wrap">
      <table class="tracker">
        <thead>
          <tr>
            <th class="rowhead">Measure</th>
            ${GRADES.map(g=>`<th class="gcol-${g}" style="text-align:center;">Grade ${g}${g>cur?' (goals only)':''}</th>`).join('')}
          </tr>
        </thead>
        <tbody>
          <tr class="band"><th class="rowhead">Placement</th>${GRADES.map(g=>`<td>${g===6?'':''}</td>`).join('')}</tr>
          <tr><th class="rowhead">Placement Test (out of 100)</th>
            ${GRADES.map(g => g===6 ? cell(6,'placement','/ 100') : `<td class="locked">n/a</td>`).join('')}</tr>

          <tr class="band"><th class="rowhead">Mid-term THINK Test (out of ${cur===6?'100':'100 / 120'})</th>${GRADES.map(()=>`<td></td>`).join('')}</tr>
          <tr><th class="rowhead">Semester 1 goal</th>${GRADES.map(g=>cell(g,'think.s1Goal','/ '+maxFor(g),{goal:true})).join('')}</tr>
          <tr><th class="rowhead">Semester 1 score</th>${GRADES.map(g=>cell(g,'think.s1Score','/ '+maxFor(g))).join('')}</tr>
          <tr><th class="rowhead">Semester 2 goal</th>${GRADES.map(g=>cell(g,'think.s2Goal','/ '+maxFor(g),{goal:true})).join('')}</tr>
          <tr><th class="rowhead">Semester 2 score</th>${GRADES.map(g=>cell(g,'think.s2Score','/ '+maxFor(g))).join('')}</tr>

          <tr class="band"><th class="rowhead">Final PEP Test (A+ – C)</th>${GRADES.map(()=>`<td></td>`).join('')}</tr>
          <tr><th class="rowhead">Semester 1 goal</th>${GRADES.map(g=>cell(g,'pep.s1Goal','',{select:PEP,goal:true})).join('')}</tr>
          <tr><th class="rowhead">Semester 1 grade</th>${GRADES.map(g=>cell(g,'pep.s1Grade','',{select:PEP})).join('')}</tr>
          <tr><th class="rowhead">Semester 2 goal</th>${GRADES.map(g=>cell(g,'pep.s2Goal','',{select:PEP,goal:true})).join('')}</tr>
          <tr><th class="rowhead">Semester 2 grade</th>${GRADES.map(g=>cell(g,'pep.s2Grade','',{select:PEP})).join('')}</tr>

          <tr class="band"><th class="rowhead">Cambridge exam</th>${GRADES.map(()=>`<td></td>`).join('')}</tr>
          <tr><th class="rowhead">Exam taken</th>${GRADES.map(g=>cell(g,'kpf.exam','',{select:KPF})).join('')}</tr>
          <tr><th class="rowhead">Grade goal</th>${GRADES.map(g=>cell(g,'kpf.goal','e.g. 145',{goal:true})).join('')}</tr>
          <tr><th class="rowhead">Score achieved</th>${GRADES.map(g=>cell(g,'kpf.score','e.g. 148')).join('')}</tr>
        </tbody>
      </table>
    </div>
  </div>`;
}

function trackerValue(rec, g, path){
  const t = rec.tracker[g] || {};
  const parts = path.split('.');
  let v = t;
  for(const p of parts){ v = (v||{})[p]; }
  return v == null ? '' : String(v);
}
function setTrackerValue(rec, g, path, val){
  const parts = path.split('.');
  let obj = rec.tracker[g];
  for(let i=0;i<parts.length-1;i++) obj = obj[parts[i]];
  obj[parts[parts.length-1]] = val;
}

/* ── Benchmark panel ── */

function benchmarkPanel(rec, bm){
  if(!bm) return '';
  const key = transitionForGrade(rec.grade);
  const testKey = TRANSITION_TEST[key] || 'PET';
  const range = TEST_RANGE[testKey];
  const best = bm.best[testKey];

  const notches = bm.tiers
    .map(t=>{ const r = t.rules.find(x=>x.test===testKey); return r ? { value:r.min, label:t.name.replace(' Class','') + ' ' + r.min } : null; })
    .filter(Boolean);

  let ruler = '';
  if(range && notches.length){
    const reached = best ? notches.filter(n=>best.overall >= n.value).length : 0;
    const stateCls = !best ? '' : reached >= notches.length ? 'met' : reached ? 'near' : 'short';
    ruler = scaleHtml(range,
      best ? [{ value: best.overall, showValue: true, title: testKey + ' ' + best.overall }] : [],
      notches,
      { fill: best ? { value: best.overall, state: stateCls } : null,
        head: `<span class="lede">${escapeHtml(testKey)} against this year's thresholds</span>
               <span class="read">${best ? 'Best recorded score ' + best.overall : 'No ' + testKey + ' score recorded yet'}</span>` });
  }

  return `
  <div class="section-block">
    <div class="sb-head"><div><div class="sb-title">${escapeHtml(bm.label)}</div>
      <div class="sb-domain">Read from the test scores recorded on this profile</div></div></div>
    ${ruler}
    <div class="bm-grid" style="margin-top:18px;">
      ${bm.tiers.map(t=>`
        <div class="bm-card ${t.met?'met':''}">
          <div class="bm-tier">${escapeHtml(t.name)}</div>
          <div class="bm-req">${escapeHtml(t.text)}</div>
          <div class="bm-state ${t.met?'yes':'no'}">${t.met?'Met':'Not yet met'}</div>
        </div>`).join('')}
    </div>
    <p class="sub-note" style="margin-top:16px;">A benchmark written as "all 4 sections" is a profile requirement: reading, writing,
      listening and speaking must each reach it, so a strong overall score alone will not satisfy it here either.</p>
  </div>`;
}

/* ── 6. Tests & goals ── */

function profileTests(rec){
  const tests = (rec.tests||[]).slice().sort((a,b)=>(a.grade-b.grade) || String(a.date).localeCompare(String(b.date)));
  return `
  <div class="section-block">
    <div class="sb-head"><div><div class="sb-title">Standardised Test Scores &amp; Goals</div>
      <div class="sb-domain">Overall and by skill, with the goal set against each one</div></div>
      <button class="btn btn-primary btn-sm no-print" onclick="event.stopPropagation();App.addTest()">+ Add test</button></div>

    ${tests.length ? tests.map(t=>testCard(rec,t)).join('') : `
      <div class="test-empty-state">No test results recorded yet. Add one to start tracking scores and goals by skill.</div>`}
  </div>

  ${studentGoalsSection(rec)}`;
}

function testCard(rec, t){
  const meta = testMeta(t.type);
  const step = meta.step ? ` step="${meta.step}"` : '';
  const maxNote = meta.max ? ' / ' + meta.max : '';
  const gap = (goal, score) => {
    const g = num(goal), s = num(score);
    if(g===null) return '';
    if(s===null) return `<span style="font-size:11px;color:var(--muted);">goal ${g}</span>`;
    const d = Math.round((s-g)*10)/10;
    return d >= 0
      ? `<span style="font-size:11px;color:var(--met);font-weight:700;">+${d} on goal</span>`
      : `<span style="font-size:11px;color:var(--near);font-weight:700;">${d} to goal</span>`;
  };
  return `
  <div class="test-card">
    <div class="test-card-head">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        <select onchange="App.testField('${t.id}','type',this.value)" style="font-weight:700;">
          ${TEST_TYPES.map(x=>`<option value="${escapeHtml(x.key)}" ${t.type===x.key?'selected':''}>${escapeHtml(x.label)}</option>`).join('')}
        </select>
        <select onchange="App.testField('${t.id}','grade',this.value)">
          ${GRADES.map(g=>`<option value="${g}" ${Number(t.grade)===g?'selected':''}>Grade ${g}</option>`).join('')}
        </select>
        <input type="date" value="${escapeHtml(t.date)}" onchange="App.testField('${t.id}','date',this.value)" style="width:auto;">
      </div>
      <button class="row-del no-print" onclick="App.removeTest('${t.id}')" title="Remove this test">✕</button>
    </div>

    <div class="score-grid">
      <div class="score-field">
        <label class="field-label">Overall${maxNote}</label>
        <input type="number"${step} value="${escapeHtml(t.overall)}" oninput="App.testField('${t.id}','overall',this.value)" onchange="App.refresh()" placeholder="score">
      </div>
      <div class="score-field goal-cell">
        <label class="field-label">Overall goal</label>
        <input type="number"${step} value="${escapeHtml(t.goalOverall)}" oninput="App.testField('${t.id}','goalOverall',this.value)" onchange="App.refresh()" placeholder="target">
        <div style="margin-top:4px;">${gap(t.goalOverall, t.overall)}</div>
      </div>
      ${SKILLS.map(s=>`
        <div class="score-field">
          <label class="field-label">${s.label}</label>
          <input type="number"${step} value="${escapeHtml(t.skills[s.key])}" oninput="App.testSkill('${t.id}','skills','${s.key}',this.value)" onchange="App.refresh()" placeholder="score">
          <input type="number"${step} value="${escapeHtml(t.goalSkills[s.key])}" oninput="App.testSkill('${t.id}','goalSkills','${s.key}',this.value)" onchange="App.refresh()"
            placeholder="goal" style="margin-top:5px;background:#FCFBF7;">
          <div style="margin-top:4px;">${gap(t.goalSkills[s.key], t.skills[s.key])}</div>
        </div>`).join('')}
    </div>

    <div class="field-group" style="margin:12px 0 0;">
      <input type="text" value="${escapeHtml(t.note||'')}" oninput="App.testField('${t.id}','note',this.value)" placeholder="Note — mock or official, centre, anything worth recording">
    </div>
  </div>`;
}

/* ── Student's own goals ── */

function studentGoalsSection(rec){

  return `
  <div class="section-block">
    <div class="sb-head"><div><div class="sb-title">Student Goals</div>
      <div class="sb-domain">Targets the student sets for themselves. ${st.done} of ${st.total} reached.</div></div></div>

      <button class="btn btn-primary btn-sm" onclick="App.addGoal()">+ Add goal</button>
    </div>

    ${g.length ? `<div style="margin-top:14px;">${g.map(x=>`
      <div class="goal-item ${x.done?'done':''}">
        <div class="goal-check" onclick="App.toggleGoal('${x.id}')">${x.done?'✓':''}</div>

          <div class="goal-text">${escapeHtml(x.text)}</div>
          <div class="goal-meta">${x.due?'Target '+escapeHtml(x.due)+', ':''}set ${fmtDate(x.createdAt)}</div>
        </div>
        <button class="row-del no-print" onclick="App.removeGoal('${x.id}')">✕</button>
      </div>`).join('')}</div>` : `<div class="no-posts-state" style="margin-top:14px;">No personal goals set yet.</div>`}
  </div>`;
}

/* ── 7. PET focus areas ── */

function profileFocus(rec){
  const sel = rec.petFocus || [];
  return `
  <div class="section-block">
    <div class="sb-head"><div><div class="sb-title">Identified Areas to Work On</div>
      <div class="sb-domain">${sel.length} area${sel.length===1?'':'s'} flagged in the checklists below</div></div></div>
    ${sel.length ? `<div class="focus-summary">${sel.map(id=>{
        const f = FOCUS_LOOKUP[id];
        return f ? `<span class="focus-pill"><b>${escapeHtml(f.cat)}</b>${escapeHtml(f.label)}</span>` : '';
      }).join('')}</div>`
      : `<div class="no-posts-state">Nothing flagged yet. Tick items in the checklists below and they appear here.</div>`}
    <div class="field-group" style="margin-top:14px;">
      <label class="field-label">Teacher note on focus areas</label>
      <textarea class="notes-textarea" placeholder="What the intervention looks like — e.g. 'Weekly inference work with short articles; speaking partner for discourse management.'"
        oninput="App.field('focusNote', this.value)">${escapeHtml(rec.focusNote)}</textarea>
    </div>
  </div>

  <div class="section-block">
    <div class="sb-head"><div><div class="sb-title">PET Competency Checklists</div>
      <div class="sb-domain">Open a skill and tick what this student needs to work on</div></div></div>
    <p class="sub-note">PET measures balanced communicative ability across Reading, Writing, Listening and Speaking rather than grammar alone,
      so target the weakest strand instead of assigning more general English practice.</p>
    ${PET_FOCUS.map(cat=>{
      const open = !!state.openFocusCats[cat.key];
      const count = cat.items.filter(i=>sel.indexOf(i.id)>=0).length;
      return `
      <div class="focus-cat ${open?'open':''}">

          <span class="focus-cat-title">${escapeHtml(cat.label)}</span>

        </div>

            const on = sel.indexOf(it.id)>=0;

function meterHtml(p){
  const cls = p.met ? 'done' : (p.pct < 34 ? 'low' : '');
  const stretchMark = p.stretch > p.min ? `<span class="meter-min" style="left:${Math.min(100,p.min/p.stretch*100)}%;" title="Minimum ${p.min}"></span>` : '';
  return `<div class="meter"><div class="meter-fill ${cls}" style="width:${p.pct}%;"></div>${stretchMark}</div>`;
}

function profileRequirements(rec){

    <p class="sub-note">Totals carry across all three grades. Logging an item in any grade counts toward the three-year target.</p>
  </div>

  ${reqReading(rec)}
  ${reqSongs(rec)}
  ${reqEssays(rec)}
  ${reqPresentations(rec)}
  ${reqVocab(rec)}`;
}

/* Which log the toolbar opens on, so the button matches the tab. */
const TAB_LOG_TYPE = { overview:'essays', programme:'essays', groups:'focus', posts:'posts' };

function renderClassOverview(){
  const className = state.activeClassName;
  const classes = getAllClassNames();
  if(!className && !classes.length){

  }
  const list = studentsInClass(className).slice().sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const entry = getOrCreateClassEntry(className);
  const tab = state.classTab;

  let body = '';
  if(tab==='overview') body = classScoreTable(list);
  else if(tab==='programme') body = classProgrammeTable(list);
  else if(tab==='groups') body = classGroupings(list);
  else if(tab==='posts') body = classPostsFeed(list);

  return `
  <div class="wrap">
    <button class="btn btn-ghost btn-sm no-print" onclick="App.go('dashboard')" style="margin-bottom:16px;">← All students</button>

    <div class="print-head">
      <div style="font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#555;">GCGS Junior High English Proficiency Development Profile</div>
      <h1 style="font-size:20px;margin-top:4px;">${escapeHtml(className||'')} — Class Overview</h1>
    </div>

    <div class="page-head" style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;">
      <div>
        <h1>${escapeHtml(className||'')}</h1>
        <div class="page-sub">${list.length} student${list.length===1?'':'s'}. Class ID <span class="mono">${escapeHtml(entry.classId)}</span></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;" class="no-print">
        <select onchange="App.openClassOverview(this.value)" style="width:auto;padding:9px 12px;">
          ${classes.map(c=>`<option value="${escapeHtml(c)}" ${c===className?'selected':''}>${escapeHtml(c)}</option>`).join('')}
        </select>
        <button class="btn btn-ghost btn-sm" onclick="App.go('credentials')">Credentials</button>
        <button class="btn btn-ghost btn-sm" onclick="App.exportClassPDF()">Export class PDF</button>
      </div>

    ${list.length ? classScaleHtml(list) : ''}
    ${classKpis(list)}

    <div class="tabs-row no-print">
      ${CLASS_TABS.map(t=>`<button class="tab-btn ${tab===t.key?'active':''}" onclick="App.setClassTab('${t.key}')">${t.label}</button>`).join('')}
    </div>

    ${list.length ? classLogToolbar(list) : ''}
    ${list.length ? body : `<div class="empty-state"><p>No students in this class yet.</p></div>`}
  </div>`;
}

function classKpis(list){
  if(!list.length) return '';
  const n = list.length;
  const reqAvg = Math.round(list.reduce((a,s)=>a+overallRequirementPct(s),0)/n);
  const metBench = list.filter(s=>{ const b=benchmarkStatus(s); return b && b.highest; }).length;
  const speechesOwed = list.reduce((a,s)=>a+speechesDue(s),0);
  const goalsTotal = list.reduce((a,s)=>a+goalStats(s).total,0);
  const goalsDone  = list.reduce((a,s)=>a+goalStats(s).done,0);
  const focusFlags = list.reduce((a,s)=>a+(s.petFocus||[]).length,0);
  return `
  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-val">${reqAvg}%</div><div class="kpi-lab">Requirements</div>
      <div class="kpi-sub">average across the five targets</div></div>
    <div class="kpi"><div class="kpi-val">${metBench}/${n}</div><div class="kpi-lab">Benchmark met</div>
      <div class="kpi-sub">at least the entry tier</div></div>
    <div class="kpi"><div class="kpi-val">${speechesOwed}</div><div class="kpi-lab">Speeches due</div>
      <div class="kpi-sub">3-minute speeches, this grade</div></div>
    <div class="kpi"><div class="kpi-val">${goalsTotal?Math.round(goalsDone/goalsTotal*100):0}%</div><div class="kpi-lab">Personal goals</div>
      <div class="kpi-sub">${goalsDone} of ${goalsTotal} reached</div></div>
    <div class="kpi"><div class="kpi-val">${focusFlags}</div><div class="kpi-lab">Focus areas</div>
      <div class="kpi-sub">flagged across the class</div></div>
  </div>`;
}

/* Scores table — mirrors the Objectives and Goals Tracker spreadsheet,
   editable inline so the class page is also a quick-entry sheet. */
/* The sheet mirrors the Objectives and Goals Tracker: results belong to
   the grade they were earned in and stay visible afterwards, so a Grade 7
   class can still be read against what it did in Grade 6. */
const SCORE_FIELDS = [
  { path:'think.s1Goal',  label:'S1 mid goal',    goal:true },
  { path:'think.s1Score', label:'S1 mid score'  },
  { path:'think.s2Goal',  label:'S2 mid goal',    goal:true },
  { path:'think.s2Score', label:'S2 mid score'  },
  { path:'pep.s1Goal',    label:'S1 final goal',  goal:true, pep:true },
  { path:'pep.s1Grade',   label:'S1 final',       pep:true },
  { path:'pep.s2Goal',    label:'S2 final goal',  goal:true, pep:true },
  { path:'pep.s2Grade',   label:'S2 final',       pep:true },
  { path:'kpf.exam',      label:'K/P/F',          exam:true },
  { path:'kpf.goal',      label:'Exam goal',      goal:true },
  { path:'kpf.score',     label:'Exam score'    }
];
const PEP_GRADES = ['A+','A','B+','B','C+','C'];

function classGradeSpan(list){
  const grades = list.map(s=>Number(s.grade)||6);
  return { top: Math.max.apply(null, grades), bottom: Math.min.apply(null, grades) };
}

function scoreCell(s, g, field){
  const future = g > (Number(s.grade)||6);
  if(future && !field.goal){
    return `<td class="locked" title="${escapeHtml(s.name||'')} is in Grade ${s.grade}. Results open in Grade ${g}.">—</td>`;
  }
  const cls = field.goal ? (future ? 'goal-cell future-goal' : 'goal-cell') : '';
  const v = trackerValue(s, g, field.path);
  if(field.pep || field.exam){
    const opts = field.exam ? ['KET','PET','FCE'] : PEP_GRADES;
    return `<td class="${cls}"><select onchange="App.trackerFor('${s.id}',${g},'${field.path}', this.value)">
      <option value="">—</option>${opts.map(o=>`<option value="${escapeHtml(o)}" ${v===o?'selected':''}>${escapeHtml(o)}</option>`).join('')}
    </select></td>`;
  }
  return `<td class="${cls}"><input type="text" value="${escapeHtml(v)}"
    oninput="App.trackerFor('${s.id}',${g},'${field.path}', this.value)"></td>`;
}

function placementCell(s){
  const v = trackerValue(s, 6, 'placement');
  return `<td><input type="text" value="${escapeHtml(v)}" placeholder="/100"
    oninput="App.trackerFor('${s.id}',6,'placement', this.value)"></td>`;
}

function scoreGradeOptions(list){
  const span = classGradeSpan(list);
  const ceiling = state.showFuture ? GRADES[GRADES.length-1] : span.top;
  return { span, opts: GRADES.filter(g => g <= ceiling) };
}

function renderScoreGradePicker(list){
  const { span, opts } = scoreGradeOptions(list);
  const view = state.scoreGrade || span.top;
  const hasFuture = span.top < GRADES[GRADES.length-1];
  const note = view === 'all'
    ? (state.showFuture ? 'Every grade, with goals open ahead of the class and results closed until they get there.'
                        : 'Every grade this class has been through, side by side.')
    : Number(view) > span.top
      ? 'Grade ' + view + ' is ahead of this class. You can set goals now; results open when they reach it.'
      : 'Results earned in Grade ' + view + '. Earlier grades stay available here.';
  return `
  <div class="table-toolbar no-print">

function classProgrammeGrid(list){
  const metric = (p, display) => {
    const cls = p.met ? 'done' : (p.pct < 34 ? 'low' : '');
    return `<td class="metric" title="${p.pct}% of ${fmtNum(p.min)}">
      <span class="metric-val">${display}</span>
      <span class="metric-bar"><i class="${cls}" style="width:${p.pct}%"></i></span></td>`;
  };
  return `
  <div class="co-wrap">
    <table class="co">
      <thead><tr>
        <th class="sticky-col col-n">#</th>
        <th class="sticky-col col-name">Student</th>
        <th>Grade</th>
        <th class="num">Words read</th><th class="num">Songs</th><th class="num">Essays</th>
        <th class="num">Presentations</th><th class="num">Vocabulary</th>
        <th class="num">Speeches</th><th class="num">Goals</th><th class="num">Focus</th><th class="num">Overall</th>
        <th class="no-print"></th>
      </tr></thead>
      <tbody>
        ${list.map((s,i)=>{
          const r=reqProgress(s,'reading'), so=reqProgress(s,'songs'), e=reqProgress(s,'essays'),
                pr=reqProgress(s,'presentations'), v=reqProgress(s,'vocab');
          const gs = goalStats(s), due = speechesDue(s), overall = overallRequirementPct(s);
          return `<tr>
            <td class="sticky-col col-n">${i+1}</td>
            <td class="sticky-col col-name name"><a onclick="App.openProfile('${s.id}')">${escapeHtml(s.name||'Unnamed')}</a></td>
            <td><span class="grade-chip g${s.grade}">G${s.grade}</span></td>
            ${metric(r,  fmtNum(r.value))}
            ${metric(so, so.value + '<span class="of">/' + so.min + '</span>')}
            ${metric(e,  e.value + '<span class="of">/' + e.min + '</span>')}
            ${metric(pr, pr.value + '<span class="of">/' + pr.min + '</span>')}
            ${metric(v,  fmtNum(v.value))}
            <td class="num">${due ? `<span class="flag warn"></span>${due}` : `<span class="flag ok"></span>0`}</td>
            <td class="num">${gs.done}<span class="of" style="color:var(--faint);">/${gs.total}</span></td>
            <td class="num">${(s.petFocus||[]).length}</td>
            <td class="overall-val" style="color:${overall>=100?'var(--met)':overall<34?'var(--near)':'var(--mark)'};">${overall}%</td>
            <td class="no-print"><button class="btn btn-sm btn-ghost" onclick="App.logForOne('${s.id}')">Log</button></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}

/* Automatic grouping of students who still owe something. */
function classGroupings(list){
  const groups = [
    { title:'Yet to meet the transition benchmark', sub:'No tier of the current grade-transition benchmark is satisfied by a recorded score.',
      alert:true, members:list.filter(s=>{ const b=benchmarkStatus(s); return !(b && b.highest); }) },
    { title:'Short of a PET / Cambridge goal', sub:'A test goal is recorded but the matching score is missing or below it.',
      alert:true, members:list.filter(s=>testGoalGaps(s).length>0) },
    { title:'3-minute speeches outstanding', sub:'One per semester, so two in each grade.',
      alert:true, members:list.filter(s=>speechesDue(s)>0) },
    { title:'Below a third on the reading target', sub:'Under 500,000 words of the 1.5 million three-year target.',
      alert:true, members:list.filter(s=>reqProgress(s,'reading').pct < 34) },
    { title:'Personal goals still open', sub:'Students with at least one unmet goal they set themselves.',
      members:list.filter(s=>{ const g=goalStats(s); return g.total > g.done; }) },
    { title:'Flagged PET focus areas', sub:'Students with identified areas to work on, grouped for targeted intervention.',
      members:list.filter(s=>(s.petFocus||[]).length>0) },
    { title:'All five requirements on track', sub:'Every requirement at or above 100% of its minimum.',
      members:list.filter(s=>REQUIREMENTS.every(r=>reqProgress(s,r.key).met)) }
  ];

  const focusTally = {};
  list.forEach(s=>(s.petFocus||[]).forEach(id=>{
    const f = FOCUS_LOOKUP[id]; if(!f) return;
    const k = f.cat + ', ' + f.label;
    focusTally[k] = (focusTally[k]||0) + 1;
  }));
  const tally = Object.entries(focusTally).sort((a,b)=>b[1]-a[1]).slice(0,12);

  return `
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;">
    ${groups.map(g=>`
      <div class="group-box ${g.alert && g.members.length ? 'alert':''}">
        <h4>${escapeHtml(g.title)} <span style="color:var(--muted);font-weight:400;">(${g.members.length})</span></h4>
        <div class="gb-sub">${escapeHtml(g.sub)}</div>
        ${g.members.length
          ? g.members.map(s=>`<span class="name-pill" onclick="App.openProfile('${s.id}')">${escapeHtml(s.name||'Unnamed')}</span>`).join('')
          : `<div style="font-size:12px;color:var(--muted);">Nobody in this group.</div>`}
      </div>`).join('')}
  </div>

  ${tally.length ? `
  <div class="section-block" style="margin-top:22px;">
    <div class="sb-head"><div><div class="sb-title">Most-flagged PET competencies</div>
      <div class="sb-domain">Where the class as a whole needs teaching time</div></div></div>
    <div class="stat-bars">
      ${tally.map(([k,n])=>`
        <div class="stat-bar-row">
          <div style="font-size:13px;min-width:230px;">${escapeHtml(k)}</div>
          <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.round(n/list.length*100)}%;"></div></div>
          <div style="font-size:12px;color:var(--muted);min-width:56px;">${n} student${n===1?'':'s'}</div>
        </div>`).join('')}
    </div>
  </div>` : ''}`;
}

const SCHEMA_SQL = `-- GCGS English Proficiency Development Profile — schema
create table if not exists gcgs_students (
  id uuid primary key default gen_random_uuid(),
  student_id text unique not null,
  owner_id uuid references auth.users(id),
  name text default '',
  chinese_name text default '',
  class_name text default '',
  grade int default 6,
  data jsonb default '{}'::jsonb,
  created_at timestamptz default now(),
  updated_at timestamptz default now()
);

create table if not exists gcgs_settings (
  key text primary key,
  value jsonb default '{}'::jsonb,
  updated_at timestamptz default now()
);

alter table gcgs_students enable row level security;
alter table gcgs_settings enable row level security;

create policy "staff read"   on gcgs_students for select to authenticated using (true);
create policy "staff write"  on gcgs_students for insert to authenticated with check (true);
create policy "staff update" on gcgs_students for update to authenticated using (true);
create policy "staff delete" on gcgs_students for delete to authenticated using (true);

create policy "settings read"  on gcgs_settings for select to authenticated using (true);
create policy "settings write" on gcgs_settings for all    to authenticated using (true) with check (true);`;
