        const p = reqProgress(rec, r.key);
        return `<div style="margin-bottom:14px;">
          <div class="req-head"><div style="font-size:13.5px;font-weight:600;">${escapeHtml(r.title)}</div>
            <div class="req-count">${fmtNum(p.value)} / ${fmtNum(p.min)}</div></div>
          ${meterHtml(p)}</div>`;
      }).join('')}
    </div>

    ${bm ? `<div class="section-block">
      <div class="sb-head"><div><div class="sb-title">${escapeHtml(bm.label)}</div>
        <div class="sb-domain">School benchmark guidelines</div></div></div>
      <div class="bm-grid">${bm.tiers.map(t=>`
        <div class="bm-card ${t.met?'met':''}">
          <div class="bm-tier">${escapeHtml(t.name)}</div>
          <div class="bm-req">${escapeHtml(t.text)}</div>
          <div class="bm-state ${t.met?'yes':'no'}">${t.met?'✓ Met':'Not yet met'}</div>
        </div>`).join('')}</div>
    </div>` : ''}

    <div class="section-block">
      <div class="sb-head"><div><div class="sb-title">Updates from School</div>
        <div class="sb-domain">${shared.length} update${shared.length===1?'':'s'} shared with families</div></div></div>
      ${shared.length ? `<div class="posts-list">${shared.map(p=>`
        <div class="post-item">
          <div class="post-timestamp">${fmtDate(p.timestamp)}</div>
          <div class="post-content">${escapeHtml(p.content)}</div>
        </div>`).join('')}</div>`
        : `<div class="no-posts-state">No updates have been shared yet.</div>`}
    </div>
  </div>`;
}

/* ══════════════════════════════════════════════════════════════
   LOG FOR THE CLASS
   Most requirement evidence is shared: the whole class reads the
   set text, sings the same song, writes the same essay. Logging it
   once and ticking off who it applies to beats opening 24 profiles.
   ══════════════════════════════════════════════════════════════ */

const CLASS_LOG_TYPES = [
  { key:'books',         label:'Book read',        verb:'Logged a book for' },
  { key:'songs',         label:'Song learned',     verb:'Logged a song for' },
  { key:'essays',        label:'Essay written',    verb:'Logged an essay for' },
  { key:'presentations', label:'Presentation given', verb:'Logged a presentation for' },
  { key:'vocab',         label:'Vocabulary list',  verb:'Logged a vocabulary list for' },
  { key:'focus',         label:'PET focus areas',  verb:'Updated focus areas for', group:'teaching' },
  { key:'posts',         label:'Post an update',   verb:'Posted an update to', group:'teaching' }
];
const REQUIREMENT_LOG_TYPES = CLASS_LOG_TYPES.filter(t => !t.group);

/* The log is scoped to one or more classes. It starts on the class you
   are looking at, because that is the usual case, but a book set for the
   whole of Grade 7 should be logged once rather than class by class. */
function logClassNames(){
  const all = getAllClassNames();
  const picked = state.logClasses || (state.activeClassName ? [state.activeClassName] : []);
  return picked.filter(c => all.indexOf(c) >= 0);
}
function logPool(){
  const out = [];
  logClassNames().forEach(c => {
    studentsInClass(c).slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'')).forEach(s => out.push(s));
  });
  return out;
}
/* null means "everyone in the chosen classes", so a newly imported
   student is included without the teacher having to re-tick the list. */
function logSelection(){
  const pool = logPool();
  if(state.logSelected === null) return pool.map(s=>s.id);
  return state.logSelected.filter(id => pool.some(s=>s.id===id));
}

function renderClassLogger(){
  const type = state.logType || 'essays';
  const pool = logPool();
  const chosen = logSelection();
  const names = logClassNames();
  const allClasses = getAllClassNames();
  const date = state.logDate || todayISO();

  const fields = {
    books: `
      <div class="fg grow"><label>Book title</label>
        <input type="text" id="log-title" placeholder="e.g. The Giver — Lois Lowry" value="${escapeHtml(state.logTitle||'')}" oninput="App.keepLog('logTitle',this.value)"></div>
      <div class="fg"><label>Word count</label>
        <input type="number" id="log-words" placeholder="43000" value="${escapeHtml(state.logWords||'')}" oninput="App.keepLog('logWords',this.value)"></div>`,
    songs: `
      <div class="fg grow"><label>Song</label>
        <input type="text" id="log-title" placeholder="e.g. Country Roads — John Denver" value="${escapeHtml(state.logTitle||'')}" oninput="App.keepLog('logTitle',this.value)"></div>`,
    essays: `
      <div class="fg grow"><label>Essay title</label>
        <input type="text" id="log-title" placeholder="e.g. Should school start later?" value="${escapeHtml(state.logTitle||'')}" oninput="App.keepLog('logTitle',this.value)"></div>`,
    presentations: `
      <div class="fg"><label>Kind</label>
        <select id="log-prestype">${PRESENTATION_TYPES.map(t=>`<option value="${t.key}" ${state.logPresType===t.key?'selected':''}>${escapeHtml(t.label)}</option>`).join('')}</select></div>
      <div class="fg grow"><label>Topic</label>
        <input type="text" id="log-title" placeholder="e.g. End-of-unit speech" value="${escapeHtml(state.logTitle||'')}" oninput="App.keepLog('logTitle',this.value)"></div>
      <div class="fg"><label>Location</label>
        <input type="text" id="log-location" placeholder="e.g. Room 304" value="${escapeHtml(state.logLocation||'')}" oninput="App.keepLog('logLocation',this.value)"></div>
      <div class="fg"><label>Length</label>
        <input type="text" id="log-length" placeholder="e.g. 3 min" value="${escapeHtml(state.logLength||'')}" oninput="App.keepLog('logLength',this.value)"></div>`,
    vocab: `
      <div class="fg grow"><label>Unit or list</label>
        <input type="text" id="log-title" placeholder="e.g. THINK 2 Unit 6 — Food" value="${escapeHtml(state.logTitle||'')}" oninput="App.keepLog('logTitle',this.value)"></div>
      <div class="fg"><label>Words</label>
        <input type="number" id="log-words" placeholder="45" value="${escapeHtml(state.logWords||'')}" oninput="App.keepLog('logWords',this.value)"></div>`,
    focus: '',
    posts: ''
  }[type];

  return `
  <div class="section-block no-print logger">
    <div class="sb-head"><div><div class="sb-title">Log for the class</div>
      <div class="sb-domain">Record one piece of evidence against every student it applies to</div></div></div>

    <div class="logger-types">
      ${CLASS_LOG_TYPES.map(t=>`<button class="type-chip ${type===t.key?'on':''}" onclick="App.setLogType('${t.key}')">${escapeHtml(t.label)}</button>`).join('')}
    </div>

    ${type === 'focus' ? focusPickerHtml() : type === 'posts' ? postComposerHtml() : `
      <div class="add-row" style="border-top:none;padding-top:0;margin-top:16px;">
        ${fields}
        <div class="fg"><label>Date</label>
          <input type="date" id="log-date" value="${escapeHtml(date)}" oninput="App.keepLog('logDate',this.value)"></div>
      </div>`}

    <div class="logger-who">
      <div class="logger-who-head">
        <span>Applies to <strong>${chosen.length}</strong> of ${pool.length} student${pool.length===1?'':'s'}${
          names.length > 1 ? ' across ' + names.length + ' classes' : ''}</span>
        <span class="logger-links">
          <a onclick="App.selectAllLog()">Everyone</a>
          <a onclick="App.selectNoneLog()">Nobody</a>
        </span>
      </div>

      ${allClasses.length > 1 ? `
        <div class="who-classes">
          <span class="who-classes-label">Classes</span>
          ${allClasses.map(c=>{
            const on = names.indexOf(c) >= 0;
            return `<span class="class-chip ${on?'on':''}" onclick="App.toggleLogClass('${escapeAttr(c)}')">
              <span class="who-box">${on?'✓':''}</span>${escapeHtml(c)}
              <span class="class-chip-n">${studentsInClass(c).length}</span></span>`;
          }).join('')}
        </div>` : ''}

      ${names.length ? names.map(c=>{
        const members = studentsInClass(c).slice().sort((a,b)=>(a.name||'').localeCompare(b.name||''));
        const n = members.filter(s=>chosen.indexOf(s.id)>=0).length;
        return `
        <div class="who-block">
          ${names.length > 1 ? `<div class="who-block-head">
            <span>${escapeHtml(c)} <span class="who-block-n">${n} of ${members.length}</span></span>
            <span class="logger-links">
              <a onclick="App.selectClassLog('${escapeAttr(c)}', true)">All</a>
              <a onclick="App.selectClassLog('${escapeAttr(c)}', false)">None</a>
            </span>
          </div>` : ''}
          <div class="who-grid">
            ${members.map(s=>{
              const on = chosen.indexOf(s.id) >= 0;
              return `<span class="who-chip ${on?'on':''}" onclick="App.toggleLogStudent('${s.id}')">
                <span class="who-box">${on?'✓':''}</span>${escapeHtml(s.name||'Unnamed')}</span>`;
            }).join('')}
          </div>
        </div>`;
      }).join('') : `<div class="meter-note">Choose at least one class above.</div>`}
    </div>

    <div class="action-row">
      <button class="btn btn-primary" onclick="App.commitClassLog()">${
        type === 'posts' ? 'Post to ' + chosen.length + ' profile' + (chosen.length===1?'':'s')
        : type === 'focus' ? (state.logMode === 'remove' ? 'Clear on ' : 'Flag on ') + chosen.length + ' student' + (chosen.length===1?'':'s')
        : 'Add to ' + chosen.length + ' student' + (chosen.length===1?'':'s')
      }</button>
      ${state.logResult ? `<span class="logger-result">${escapeHtml(state.logResult)}</span>` : ''}
    </div>
  </div>`;
}

/* Flagging the same weakness across a class is the usual case after a
   mock: whole-class results point at one or two strands, not twenty. */
function focusPickerHtml(){
  const picked = state.logFocus || [];
  const mode = state.logMode || 'add';
  return `
    <div class="logger-mode">
      <button class="mode-chip ${mode==='add'?'on':''}" onclick="App.setLogMode('add')">Flag as needing work</button>
      <button class="mode-chip ${mode==='remove'?'on':''}" onclick="App.setLogMode('remove')">Clear the flag</button>
      <span class="toolbar-note">${mode==='add'
        ? 'Ticked areas are added to each student, leaving anything already flagged in place.'
        : 'Ticked areas are removed from each student. Nothing else on their profile changes.'}</span>
    </div>
    <div class="focus-picker">
      ${PET_FOCUS.map(cat=>`
        <div class="fp-cat">
          <div class="fp-cat-title">${escapeHtml(cat.label)}</div>
          <div class="fp-items">
            ${cat.items.map(it=>{
              const on = picked.indexOf(it.id) >= 0;
              return `<span class="fp-chip ${on?'on':''}" onclick="App.toggleLogFocus('${it.id}')" title="${escapeHtml(it.hint)}">
                <span class="who-box">${on?'✓':''}</span>${escapeHtml(it.label)}</span>`;
            }).join('')}
          </div>
        </div>`).join('')}
    </div>`;
}

function postComposerHtml(){
  const shared = !!state.logParentVisible;
  return `
    <div class="logger-post">
      <textarea id="log-post" placeholder="e.g. Unit 4 speaking assessment today. Most of the class sustained a two-minute answer without prompting."
        oninput="App.keepLog('logPost', this.value)">${escapeHtml(state.logPost||'')}</textarea>
      <div class="logger-post-foot">
        <span class="inline-check ${shared?'on':''}" onclick="App.toggleLogParentVisible()">
          <span class="box">${shared?'✓':''}</span><span>Share this update with parents</span>
        </span>
        <span class="toolbar-note">A copy is filed on each student's own timeline, so you can edit or delete it per student afterwards.</span>
      </div>
    </div>`;
}

/* ══════════════════════════════════════════════════════════════
   APP — all event handlers
   ══════════════════════════════════════════════════════════════ */

function val(id){ const el = document.getElementById(id); return el ? el.value : ''; }
function clearField(id){ const el = document.getElementById(id); if(el) el.value = ''; }
function touch(rec){ saveStudent(rec); }

const App = {

  /* ── navigation ── */
  go(view){
    state.view = view;
    state.authError = '';
    render();
  },
  render(opts){ render(opts); },
  refresh(){ render({preserveScroll:true}); },

  openProfile(id){
    state.activeId = id;
    state.profileTab = 'general';
    state.view = state.parentMode ? 'parentProfile' : 'profile';
    render();
  },
  openParentProfile(id){ state.activeId = id; state.view = 'parentProfile'; render(); },
  backFromProfile(){
    const rec = activeStudent();
    if(rec && rec.className){ App.openClassOverview(rec.className); return; }
    App.go('dashboard');
  },
  setProfileTab(t){ state.profileTab = t; render(); },
  setClassTab(t){ state.classTab = t; render(); },
  setScoreGrade(g){ state.scoreGrade = g; render({preserveScroll:true}); },
  toggleFutureGrades(){
    state.showFuture = !state.showFuture;
    // Stepping back out of a grade nobody has reached would leave an empty view.
    if(!state.showFuture){
      const list = studentsInClass(state.activeClassName);
      const top = list.length ? classGradeSpan(list).top : 6;
      if(state.scoreGrade !== 'all' && Number(state.scoreGrade) > top) state.scoreGrade = null;
    }
    render({preserveScroll:true});
  },
  navClassOverview(){
    const rec = activeStudent();
    const classes = getAllClassNames();
    state.activeClassName = state.activeClassName || (rec && rec.className) || classes[0] || '';
    state.classTab = 'overview';
    state.view = 'classOverview';
    render();
  },
  openClassOverview(name){
    if(state.activeClassName !== name){
      state.scoreGrade = null;
      state.logClasses = null;
      state.logSelected = null;
    }
    state.activeClassName = name;
    state.classTab = state.classTab || 'overview';
    state.view = 'classOverview';
    render();
  },

  /* ── auth ── */
  async submitAuth(mode){
    const email = val('auth-email').trim(), password = val('auth-password');
    if(!email || !password){ state.authError = 'Enter both an email and a password.'; return render(); }
    if(!db.isConnected()){ state.authError = 'No database connected. Use the local-only option below, or connect Supabase first.'; return render(); }
    state.authBusy = true; state.authError = ''; render();
    try{
      const fn = mode === 'login' ? 'signInWithPassword' : 'signUp';
      const { data, error } = await db.client.auth[fn]({ email, password });
      if(error) throw error;
      if(mode === 'signup' && (!data.session)){
        state.authBusy = false;
        state.authError = 'Account created. Check your email to confirm, then log in.';
        state.view = 'login';
        return render();
      }
      state.userId = data.user.id;
      state.userEmail = data.user.email;
      state.students = await loadAllStudentsAsync();
      state.settings = await loadSettingsAsync();
      state.authBusy = false;
      App.go('dashboard');
    }catch(e){
      state.authBusy = false;
      state.authError = e.message || 'Sign-in failed.';
      render();
    }
  },
  async logout(){
    if(db.isConnected()){ try{ await db.client.auth.signOut(); }catch(e){} }
    state.userId = null; state.userEmail = null; state.students = [];
    App.go('login');
  },
  useLocalOnly(){
    state.students = loadAllStudentsLocal();
    state.settings = loadSettingsLocal();
    App.go('dashboard');
  },

  /* ── class list ── */
  toggleClass(name){
    if(state.collapsed[name]) delete state.collapsed[name];
    else state.collapsed[name] = true;
    saveCollapsed();
    render({preserveScroll:true});
  },
  toggleAllClasses(){
    const classes = getAllClassNames();
    if(allClassesCollapsed(classes)) state.collapsed = {};
    else classes.forEach(c => { state.collapsed[c] = true; });
    saveCollapsed();
    render({preserveScroll:true});
  },

  /* ── new student ── */
  startNewStudent(){ state.draft = newStudent(); App.go('newStudent'); },
  draftField(k,v){
    if(!state.draft) state.draft = newStudent();
    state.draft[k] = (k==='grade') ? Number(v) : v;
    if(k==='grade') render({preserveScroll:true});
  },
  async saveNewStudent(){
    const d = state.draft;
    if(!d || !d.name.trim()){ alert('Give the student an English name first.'); return; }
    if(d.className) getOrCreateClassEntry(d.className.trim());
    d.className = d.className.trim();
    state.students.unshift(d);
    await saveStudentNow(d);
    state.draft = null;
    App.openProfile(d.id);
  },
  async deleteStudent(id){
    const rec = state.students.find(s=>s.id===id);
    if(!rec) return;
    if(!confirm('Delete ' + (rec.name||'this student') + ' and all of their tracker data? This cannot be undone.')) return;
    await deleteStudentRecord(id);
    App.go('dashboard');
  },

  /* ── bulk import ── */
  setBulk(k,v){
    state[k] = (k==='bulkGrade') ? Number(v) : v;
    if(k==='bulkGrade' || k==='bulkPreview') render({preserveScroll:true});
  },
  previewBulk(){
    const parsed = parseNameList(state.bulkText);
    if(!parsed.length){ alert('No names found. Put one student per line.'); return; }
    state.bulkPreview = parsed;
    render({preserveScroll:true});
  },
  handleBulkFile(input){
    const f = input.files && input.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{ state.bulkText = String(r.result||''); state.bulkPreview = parseNameList(state.bulkText); render(); };
    r.readAsText(f);
  },
  async confirmBulk(){
    const list = state.bulkPreview || [];
    const className = (state.bulkClassName||'').trim();
    if(!className){ alert('Give the class a name first.'); return; }
    getOrCreateClassEntry(className);
    const created = list.map(p => newStudent({ name:p.name, chineseName:p.chineseName, className, grade:state.bulkGrade }));
    created.forEach(r => state.students.unshift(r));
    for(const r of created){ await saveStudentNow(r); }
    state.bulkText = ''; state.bulkPreview = null;
    state.activeClassName = className;
    App.openClassOverview(className);
  },

  /* ── profile fields ── */
  field(k,v){
    const rec = activeStudent(); if(!rec) return;
    if(k==='className'){ rec[k] = v; if(v.trim()) getOrCreateClassEntry(v.trim()); }
    else rec[k] = v;
    touch(rec);
  },
  setGrade(g){
    const rec = activeStudent(); if(!rec) return;
    rec.grade = Number(g); touch(rec); render({preserveScroll:true});
  },
  toggleTutor(){
    const rec = activeStudent(); if(!rec) return;
    rec.hasTutor = !rec.hasTutor; touch(rec); render({preserveScroll:true});
  },
  ixlField(k,v){
    const rec = activeStudent(); if(!rec) return;
    rec.ixl[k] = v; touch(rec);
  },
  copyText(t){
    if(navigator.clipboard) navigator.clipboard.writeText(t).catch(()=>{});
    else { const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} ta.remove(); }
  },

  /* ── tracker ── */
  tracker(g, path, v){
    const rec = activeStudent(); if(!rec) return;
    setTrackerValue(rec, g, path, v); touch(rec);
  },
  trackerFor(id, g, path, v){
    const rec = state.students.find(s=>s.id===id); if(!rec) return;
    setTrackerValue(rec, g, path, v); touch(rec);
  },

  /* ── tests ── */
  addTest(){
    const rec = activeStudent(); if(!rec) return;
    rec.tests.push(newTest(rec.grade)); touch(rec); render({preserveScroll:true});
  },
  removeTest(id){
    const rec = activeStudent(); if(!rec) return;
    rec.tests = rec.tests.filter(t=>t.id!==id); touch(rec); render({preserveScroll:true});
  },
  testField(id,k,v){
    const rec = activeStudent(); if(!rec) return;
    const t = rec.tests.find(x=>x.id===id); if(!t) return;
    t[k] = (k==='grade') ? Number(v) : v;
    touch(rec);
    if(k==='type' || k==='grade') render({preserveScroll:true});
  },
  testSkill(id, group, skill, v){
    const rec = activeStudent(); if(!rec) return;
    const t = rec.tests.find(x=>x.id===id); if(!t) return;
    t[group][skill] = v; touch(rec);
  },

  /* ── goals ── */
  addGoal(){
    const rec = activeStudent(); if(!rec) return;
    const text = val('goal-text').trim();
    if(!text) return;
    rec.goals.push({ id:uid('g'), text, due: val('goal-due'), done:false, createdAt:Date.now() });
    clearField('goal-text'); clearField('goal-due');
    touch(rec); render({preserveScroll:true});
  },
  toggleGoal(id){
    const rec = activeStudent(); if(!rec) return;
    const g = rec.goals.find(x=>x.id===id); if(!g) return;
    g.done = !g.done; touch(rec); render({preserveScroll:true});
  },
  removeGoal(id){
    const rec = activeStudent(); if(!rec) return;
    rec.goals = rec.goals.filter(x=>x.id!==id); touch(rec); render({preserveScroll:true});
  },

  /* ── PET focus ── */
  toggleFocusCat(k){ state.openFocusCats[k] = !state.openFocusCats[k]; render({preserveScroll:true}); },
  toggleFocus(id){
    const rec = activeStudent(); if(!rec) return;
    const i = rec.petFocus.indexOf(id);
    if(i>=0) rec.petFocus.splice(i,1); else rec.petFocus.push(id);
    touch(rec); render({preserveScroll:true});
  },

  /* ── requirement logs ── */
  addBook(){
    const rec = activeStudent(); if(!rec) return;
    const title = val('book-title').trim(), words = val('book-words');
    if(!title){ return; }
    rec.books.push({ id:uid('b'), title, words: Number(words)||0, grade: Number(val('book-grade'))||rec.grade, date: todayISO() });
    clearField('book-title'); clearField('book-words');
    touch(rec); render({preserveScroll:true});
  },
  useRecommended(title){
    const el = document.getElementById('book-title');
    if(el){ el.value = title; el.focus(); }
  },
  addSong(){
    const rec = activeStudent(); if(!rec) return;
    const title = val('song-title').trim(); if(!title) return;
    rec.songs.push({ id:uid('so'), title, grade: Number(val('song-grade'))||rec.grade, date: todayISO() });
    clearField('song-title'); touch(rec); render({preserveScroll:true});
  },
  addEssay(){
    const rec = activeStudent(); if(!rec) return;
    const title = val('essay-title').trim(); if(!title) return;
    rec.essays.push({ id:uid('e'), title, grade: Number(val('essay-grade'))||rec.grade, date: todayISO() });
    clearField('essay-title'); touch(rec); render({preserveScroll:true});
  },
  addPresentation(){
    const rec = activeStudent(); if(!rec) return;
    const topic = val('pres-topic').trim();
    const type = val('pres-type') || 'other';
    if(!topic && type==='other') return;
    rec.presentations.push({ id:uid('p'), type, topic, location: val('pres-location'),
      length: val('pres-length') || (type==='3min' ? '3 min' : ''), grade: Number(val('pres-grade'))||rec.grade, date: todayISO() });
    clearField('pres-topic'); clearField('pres-location'); clearField('pres-length');
    touch(rec); render({preserveScroll:true});
  },
  addVocab(){
    const rec = activeStudent(); if(!rec) return;
    const unit = val('vocab-unit').trim(), words = val('vocab-words');
    if(!unit) return;
    rec.vocab.push({ id:uid('v'), unit, words: Number(words)||0, grade: Number(val('vocab-grade'))||rec.grade, date: todayISO() });
    clearField('vocab-unit'); clearField('vocab-words');
    touch(rec); render({preserveScroll:true});
  },
  removeItem(listKey, id){
    const rec = activeStudent(); if(!rec) return;
    rec[listKey] = rec[listKey].filter(x=>x.id!==id);
    touch(rec); render({preserveScroll:true});
  },

  /* ── posts ── */
  addPost(){
    const rec = activeStudent(); if(!rec) return;
    const content = val('new-post').trim(); if(!content) return;
    rec.posts.push({ id:uid('po'), content, timestamp:Date.now(), parentVisible:false, author: state.userEmail||'' });
    clearField('new-post'); touch(rec); render({preserveScroll:true});
  },
  togglePostVisibility(id){
    const rec = activeStudent(); if(!rec) return;
    const p = rec.posts.find(x=>x.id===id); if(!p) return;
    p.parentVisible = !p.parentVisible; touch(rec); render({preserveScroll:true});
  },
  removePost(id){
    const rec = activeStudent(); if(!rec) return;
    if(!confirm('Delete this post?')) return;
    rec.posts = rec.posts.filter(x=>x.id!==id); touch(rec); render({preserveScroll:true});
  },

  /* ── log for the class ── */
  keepLog(k, v){ state[k] = v; },
  toggleLogger(){
    state.loggerOpen = !state.loggerOpen;
    state.logResult = '';
    // Open on the log that matches the tab you are looking at.
    if(state.loggerOpen){
      const want = TAB_LOG_TYPE[state.classTab];
      if(want === 'focus' || want === 'posts' || state.logType === 'focus' || state.logType === 'posts') state.logType = want;
    }
    render({preserveScroll:true});
  },
  setLogMode(m){ state.logMode = m; state.logResult = ''; render({preserveScroll:true}); },
  toggleLogFocus(id){
    const sel = state.logFocus || (state.logFocus = []);
    const i = sel.indexOf(id);
    if(i >= 0) sel.splice(i,1); else sel.push(id);
    state.logResult = '';
    render({preserveScroll:true});
  },
  toggleLogParentVisible(){ state.logParentVisible = !state.logParentVisible; render({preserveScroll:true}); },
  setLogType(t){
    state.logType = t;
    state.logResult = '';
    state.logTitle = ''; state.logWords = ''; state.logLocation = ''; state.logLength = '';
    render({preserveScroll:true});
  },
  toggleClassPostVisibility(studentId, postId){
    const rec = state.students.find(s=>s.id===studentId); if(!rec) return;
    const p = (rec.posts||[]).find(x=>x.id===postId); if(!p) return;
    p.parentVisible = !p.parentVisible;
    saveStudent(rec);
    render({preserveScroll:true});
  },
  removeClassPost(studentId, postId){
    const rec = state.students.find(s=>s.id===studentId); if(!rec) return;
    if(!confirm('Delete this post from ' + (rec.name||'this student') + '?')) return;
    rec.posts = (rec.posts||[]).filter(x=>x.id!==postId);
    saveStudent(rec);
    render({preserveScroll:true});
  },
  toggleLogStudent(id){
    const sel = logSelection();
    const i = sel.indexOf(id);
    if(i >= 0) sel.splice(i,1); else sel.push(id);
    state.logSelected = sel;
    state.logResult = '';
    render({preserveScroll:true});
  },
  toggleLogClass(name){
    const names = logClassNames().slice();
    const i = names.indexOf(name);
    if(i >= 0){
      names.splice(i,1);
      // Drop that class's students from an explicit selection.
      if(state.logSelected !== null){
        const ids = studentsInClass(name).map(s=>s.id);
        state.logSelected = state.logSelected.filter(id => ids.indexOf(id) < 0);
      }
    } else {
      // An explicit selection keeps its shape: the new class joins it whole.
      const before = state.logSelected !== null ? logSelection() : null;
      names.push(name);
      if(before !== null) state.logSelected = before.concat(studentsInClass(name).map(s=>s.id));
    }
    state.logClasses = names;
    state.logResult = '';
    render({preserveScroll:true});
  },
  selectClassLog(name, all){
    const ids = studentsInClass(name).map(s=>s.id);
    const sel = logSelection().filter(id => ids.indexOf(id) < 0);
    state.logSelected = all ? sel.concat(ids) : sel;
    state.logResult = '';
    render({preserveScroll:true});
  },
  selectAllLog(){ state.logSelected = null; state.logResult = ''; render({preserveScroll:true}); },
  selectNoneLog(){ state.logSelected = []; state.logResult = ''; render({preserveScroll:true}); },
  logForOne(id){
    const rec = state.students.find(s=>s.id===id);
    if(rec && rec.className) state.logClasses = [rec.className.trim()];
    state.logSelected = [id];
    state.logResult = '';
    state.loggerOpen = true;
    render({preserveScroll:true});
    const el = document.querySelector('.logger');
    if(el) el.scrollIntoView({ behavior:'smooth', block:'start' });
  },
  async commitClassLog(){
    const list = logPool();
    const ids = logSelection();
    const type = state.logType || 'essays';
    const title = (val('log-title') || '').trim();
    const date = val('log-date') || todayISO();
    const words = Number(val('log-words')) || 0;

    if(!ids.length){ state.logResult = 'Choose at least one student first.'; return render({preserveScroll:true}); }

    const targets = list.filter(s => ids.indexOf(s.id) >= 0);

    if(type === 'posts'){
      const content = (val('log-post') || '').trim();
      if(!content){ state.logResult = 'Write the update before posting it.'; return render({preserveScroll:true}); }
      const stamp = Date.now();
      const shared = !!state.logParentVisible;
      targets.forEach(rec => {
        rec.posts.push({ id:uid('po'), content, timestamp:stamp, parentVisible:shared, author:state.userEmail||'' });
      });
      state.logResult = 'Posted to ' + targets.length + ' profile' + (targets.length===1?'':'s')
        + logScopeSuffix(targets) + (shared ? ', shared with parents.' : '.');
      state.logPost = '';
      render({preserveScroll:true});
      for(const rec of targets){ await saveStudentNow(rec); }
      return;
    }

    if(type === 'focus'){
      const picked = state.logFocus || [];
      if(!picked.length){ state.logResult = 'Tick at least one focus area first.'; return render({preserveScroll:true}); }
      const removing = state.logMode === 'remove';
      targets.forEach(rec => {
        if(removing) rec.petFocus = rec.petFocus.filter(id => picked.indexOf(id) < 0);
        else picked.forEach(id => { if(rec.petFocus.indexOf(id) < 0) rec.petFocus.push(id); });
      });
      state.logResult = (removing ? 'Cleared ' : 'Flagged ') + picked.length + ' area'
        + (picked.length===1?'':'s') + ' on ' + targets.length + ' student' + (targets.length===1?'':'s')
        + logScopeSuffix(targets) + '.';
      state.logFocus = [];
      render({preserveScroll:true});
      for(const rec of targets){ await saveStudentNow(rec); }
      return;
    }

    if(!title){ state.logResult = 'Give it a title before adding it.'; return render({preserveScroll:true}); }

    const presType = val('log-prestype') || 'other';
    const location = val('log-location') || '';
    const length = val('log-length') || (presType === '3min' ? '3 min' : '');

    targets.forEach(rec => {
      const g = Number(rec.grade) || 6;
      let item;
      if(type === 'books')              item = { id:uid('b'),  title, words, grade:g, date };
      else if(type === 'songs')         item = { id:uid('so'), title, grade:g, date };
      else if(type === 'essays')        item = { id:uid('e'),  title, grade:g, date };
      else if(type === 'vocab')         item = { id:uid('v'),  unit:title, words, grade:g, date };
      else                              item = { id:uid('p'),  type:presType, topic:title, location, length, grade:g, date };
      rec[type].push(item);
    });

    const meta = CLASS_LOG_TYPES.find(t => t.key === type);
    state.logResult = meta.verb + ' ' + targets.length + ' student' + (targets.length===1?'':'s')
      + logScopeSuffix(targets) + '.';
    state.logTitle = ''; state.logWords = ''; state.logLocation = ''; state.logLength = '';
    render({preserveScroll:true});
    for(const rec of targets){ await saveStudentNow(rec); }
  },

  /* ── admin ── */
  setReadingList(g, text){
    state.settings.readingLists[g] = String(text||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    saveSettings();
  },
  resetReadingLists(){
    state.settings.readingLists = JSON.parse(JSON.stringify(DEFAULT_READING_LISTS));
    saveSettings(); render({preserveScroll:true});
  },
  rotateParentKey(className){
    if(!confirm('Reset the parent link for ' + className + '? The old link will stop working.')) return;
    const reg = loadClassRegistry();
    if(reg[className]){ reg[className].parentKey = Math.random().toString(36).slice(2,10); saveClassRegistry(reg); }
    render({preserveScroll:true});
  },

  /* ── database ── */
  async connectDb(){
    const ok = await db.connect(val('sb-url').trim(), val('sb-key').trim());
    if(ok){
      state.students = await loadAllStudentsAsync();
      state.settings = await loadSettingsAsync();
      App.go(state.userEmail ? 'dashboard' : 'login');
    } else {
      render();
    }
  },
  disconnectDb(){ db.clearConfig(); render(); },
  copySchema(){ App.copyText(SCHEMA_SQL); },

  /* ── exports ── */
  exportProfilePDF(){
    const rec = activeStudent(); if(!rec) return;
    printDoc(printProfileDoc(rec));
  },
  exportTestsPDF(){
    const rec = activeStudent(); if(!rec) return;
    printDoc(printTestsDoc(rec));
  },
  exportClassPDF(){
    const list = studentsInClass(state.activeClassName).slice().sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    printDoc(printClassDoc(state.activeClassName, list));
  },
  exportCredentialsCSV(){
    const list = studentsInClass(state.activeClassName).slice().sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    const rows = [['English name','Chinese name','Class','Grade','User ID','Password','IXL username','IXL password']];
    list.forEach(s=>rows.push([s.name,s.chineseName,s.className,s.grade,s.userId,s.password,s.ixl.username,s.ixl.password]));
    downloadCSV(rows, (state.activeClassName||'class') + '-credentials.csv');
  },
  exportAllCSV(){
    const rows = [['English name','Chinese name','Class','Grade','Words read','Songs','Essays','Presentations','Vocabulary','Goals done','Goals total','Focus areas','Benchmark met']];
    state.students.forEach(s=>{
      const bm = benchmarkStatus(s), gs = goalStats(s);
      rows.push([s.name,s.chineseName,s.className,s.grade,sumBooks(s),(s.songs||[]).length,(s.essays||[]).length,
        (s.presentations||[]).length,sumVocab(s),gs.done,gs.total,(s.petFocus||[]).length, bm&&bm.highest?bm.highest.name:'None']);
    });
    downloadCSV(rows, 'gcgs-english-profiles.csv');
  },
  exportJSON(){
    const blob = new Blob([JSON.stringify({ version:1, exportedAt:new Date().toISOString(),
      settings: state.settings, students: state.students }, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'gcgs-english-profiles.json';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  },
  importJSON(input){
    const f = input.files && input.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = async ()=>{
      try{
        const parsed = JSON.parse(String(r.result));
        const incoming = (parsed.students||[]).map(migrate);
        if(!incoming.length){ alert('No students found in that file.'); return; }
        if(!confirm('Import ' + incoming.length + ' student record(s)? Records with a matching ID will be replaced.')) return;
        incoming.forEach(rec=>{
          const i = state.students.findIndex(s=>s.id===rec.id);
          if(i>=0) state.students[i] = rec; else state.students.push(rec);
        });
        if(parsed.settings){ state.settings = Object.assign({}, DEFAULT_SETTINGS, parsed.settings); saveSettings(); }
        for(const rec of incoming){ await saveStudentNow(rec); }
        render();
      }catch(e){ alert('That file could not be read: ' + e.message); }
    };
    r.readAsText(f);
  }
};

/* ══════════════════════════════════════════════════════════════
   PRINT / PDF EXPORT
   ══════════════════════════════════════════════════════════════ */

/* "across 3 classes" only when it actually spans more than one. */
function logScopeSuffix(targets){
  const set = new Set();
  targets.forEach(s => { if(s.className) set.add(s.className.trim()); });
  return set.size > 1 ? ' across ' + set.size + ' classes' : '';
}

function printDoc(html){
  const app = document.getElementById('app');
  app.innerHTML = html;
  window.scrollTo(0,0);
  const restore = ()=>{ window.removeEventListener('afterprint', restore); render(); };
  window.addEventListener('afterprint', restore);
  setTimeout(()=>{ window.print(); setTimeout(()=>{ if(document.getElementById('app').querySelector('.pdoc')) restore(); }, 800); }, 120);
}

function printHeader(title, sub){
  return `
  <div class="print-head" style="display:block;">
    <div style="font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#555;">GCGS Junior High English Proficiency Development Profile</div>
    <h1 style="font-size:21px;margin-top:4px;">${escapeHtml(title)}</h1>
    ${sub?`<div style="font-size:12px;color:#666;margin-top:3px;">${escapeHtml(sub)}</div>`:''}
    <div style="font-size:11px;color:#888;margin-top:6px;">Generated ${fmtDate(Date.now())}</div>
  </div>`;
}

function printProfileDoc(rec){
  const bm = benchmarkStatus(rec);
  const sel = rec.petFocus||[];
  return `<div class="wrap pdoc">
    ${printHeader((rec.name||'Unnamed') + (rec.chineseName? ' ' + rec.chineseName : ''),
      'Grade ' + rec.grade + (rec.className ? ', ' + rec.className : ''))}
    <div class="card">
      <h3 style="font-size:14px;margin-bottom:8px;">General</h3>
      <p style="font-size:12.5px;white-space:pre-wrap;">${escapeHtml(rec.info||'—')}</p>
      <h3 style="font-size:14px;margin:14px 0 8px;">Home</h3>
      <p style="font-size:12.5px;white-space:pre-wrap;">${escapeHtml(rec.homeInfo||'—')}</p>
      <p style="font-size:12.5px;"><strong>Home tutor:</strong> ${rec.hasTutor ? escapeHtml(rec.tutorInfo||'Yes') : 'No'}</p>
      <p style="font-size:12.5px;"><strong>IXL:</strong> ${escapeHtml(rec.ixl.username||'—')}</p>
    </div>
    ${profileTracker(rec)}
    ${benchmarkPanel(rec, bm)}
    ${profileTests(rec)}
    <div class="section-block">
      <div class="sb-head"><div class="sb-title">Identified Areas to Work On</div></div>
      ${sel.length ? `<div class="focus-summary">${sel.map(id=>{const f=FOCUS_LOOKUP[id];return f?`<span class="focus-pill"><b>${escapeHtml(f.cat)}</b>${escapeHtml(f.label)}</span>`:'';}).join('')}</div>` : '<p style="font-size:12.5px;">None flagged.</p>'}
      ${rec.focusNote ? `<p style="font-size:12.5px;margin-top:10px;white-space:pre-wrap;">${escapeHtml(rec.focusNote)}</p>` : ''}
    </div>
    ${profileRequirements(rec)}
  </div>`;
}

function printTestsDoc(rec){
  return `<div class="wrap pdoc">
    ${printHeader((rec.name||'Unnamed') + ' — Test Scores & Goals',
      'Grade ' + rec.grade + (rec.className ? ', ' + rec.className : ''))}
    ${profileTests(rec)}
    ${benchmarkPanel(rec, benchmarkStatus(rec))}
  </div>`;
}

function printClassDoc(className, list){
  return `<div class="wrap pdoc">
    ${printHeader(className + ' — Class Overview', list.length + ' students')}
    ${classKpis(list)}
    <h3 style="font-size:14px;margin:18px 0 8px;">Objectives and Goals Tracker</h3>
    ${classScoreTable(list)}
    <h3 style="font-size:14px;margin:18px 0 8px;">Three-Year Programme Requirements</h3>
    ${classProgrammeGrid(list)}
    <h3 style="font-size:14px;margin:18px 0 8px;">Groupings &amp; Flags</h3>
    ${classGroupings(list)}
  </div>`;
}

function csvEscape(v){
  const s = String(v==null?'':v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function downloadCSV(rows, filename){
  const csv = rows.map(r=>r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

window.App = App;
init();

})();
