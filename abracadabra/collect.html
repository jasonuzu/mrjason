<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cursed Reliquary — Collect Item</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@400;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --gold:#c8a951; --gold-light:#f0d080; --gold-dark:#8a6f2e;
  --blood:#8b0000; --blood-light:#cc2200;
  --text-main:#e8d5a0; --text-dim:#a0885a; --text-bright:#f5e8c0;
  --set-green:#44bb44; --corrupt-purple-bright:#bb88ee;
  --border-color:#5a3f1e; --border-bright:#8a6030;
  --magic-blue:#6699cc;
}
* { box-sizing:border-box; margin:0; padding:0; }
body {
  background:#0a0705; color:var(--text-main);
  font-family:'IM Fell English',serif; min-height:100vh;
  display:flex; align-items:flex-start; justify-content:center;
  padding:40px 16px;
}
body::before {
  content:''; position:fixed; inset:0;
  background-image:
    radial-gradient(ellipse at 30% 20%, rgba(139,0,0,0.07) 0%, transparent 55%),
    radial-gradient(ellipse at 70% 80%, rgba(153,102,204,0.05) 0%, transparent 50%);
  pointer-events:none; z-index:0;
}
.collect-wrap { position:relative; z-index:1; width:100%; max-width:540px; }

.brand {
  text-align:center; margin-bottom:24px;
}
.brand-title {
  font-family:'Cinzel Decorative',serif; font-size:15px;
  letter-spacing:4px; color:var(--gold-dark); text-transform:uppercase;
}
.brand-sub {
  font-family:'Cinzel',serif; font-size:9px; letter-spacing:3px;
  color:var(--text-dim); text-transform:uppercase; margin-top:6px; opacity:0.6;
}

.card-shell {
  background:linear-gradient(170deg, #1e1208 0%, #160e06 60%, #1a1008 100%);
  border:1px solid var(--border-color); border-radius:2px;
  padding:28px 30px 26px; position:relative;
  box-shadow:0 8px 40px rgba(0,0,0,0.6);
}
.card-shell::before {
  content:''; position:absolute; inset:3px;
  border:1px solid rgba(90,63,30,0.25); border-radius:1px; pointer-events:none;
}

/* Loading / error states */
.state-msg { text-align:center; padding:50px 20px; }
.state-deco { font-size:36px; color:var(--blood); opacity:0.5; margin-bottom:16px; }
.state-title { font-family:'Cinzel',serif; font-size:14px; letter-spacing:2px; color:var(--gold-light); margin-bottom:10px; }
.state-body { font-size:15px; color:var(--text-dim); font-style:italic; line-height:1.6; }

/* Sprite frame */
.sprite-frame {
  width:120px; height:120px; margin:0 auto 18px;
  background:radial-gradient(circle at 50% 40%, rgba(40,28,16,0.9), rgba(12,8,5,0.95));
  border:1px solid var(--border-color); border-radius:2px;
  display:flex; align-items:center; justify-content:center;
  position:relative; box-shadow:inset 0 0 20px rgba(0,0,0,0.6);
}
.sprite-frame canvas { image-rendering:pixelated; width:96px; height:96px; }

.share-badge {
  text-align:center; font-family:'Cinzel',serif; font-size:9px;
  letter-spacing:2px; color:var(--gold-dark); text-transform:uppercase;
  margin-bottom:14px;
}
.copies-remaining {
  display:inline-block; padding:3px 10px; border:1px solid rgba(90,63,30,0.4);
  border-radius:2px; font-size:9px; letter-spacing:1px; color:var(--text-dim);
  margin-left:8px;
}

/* Item display */
.item-tier-badge {
  display:inline-block; font-family:'Cinzel',serif; font-size:9px;
  letter-spacing:2px; padding:4px 12px; border-radius:2px; text-transform:uppercase;
  margin-bottom:10px;
}
.item-name {
  font-family:'Cinzel',serif; font-size:22px; font-weight:700;
  color:var(--gold-light); text-align:center; line-height:1.2; margin-bottom:6px;
  text-shadow:0 0 20px rgba(200,169,81,0.2);
}
.item-base { text-align:center; font-size:15px; color:var(--text-dim); font-style:italic; margin-bottom:4px; }
.item-curse { text-align:center; font-family:'Cinzel',serif; font-size:10px; letter-spacing:1px; color:var(--text-dim); margin-bottom:16px; }

.divider { height:1px; background:linear-gradient(to right, transparent, var(--gold-dark), transparent); margin:16px 0; opacity:0.5; }

.section-head {
  font-family:'Cinzel',serif; font-size:11px; letter-spacing:2px;
  color:var(--gold); text-transform:uppercase; margin-bottom:6px;
}
.effect-desc { font-size:15px; line-height:1.65; color:var(--text-main); margin-bottom:8px; }
.effect-penalty { font-size:14px; font-style:italic; color:#a06a4a; line-height:1.6; }
.lore-block {
  margin-top:16px; padding:12px 16px; border-left:2px solid var(--gold-dark);
  background:rgba(90,63,30,0.08); font-size:14px; font-style:italic;
  color:var(--text-dim); line-height:1.6;
}
.meta-line { font-family:'Cinzel',serif; font-size:9px; letter-spacing:1px; color:rgba(160,136,90,0.6); margin-top:14px; text-align:center; }

/* Collect button + form */
.collect-section { margin-top:22px; }
.collect-btn {
  display:block; width:100%; padding:15px 0;
  font-family:'Cinzel',serif; font-size:14px; font-weight:700;
  letter-spacing:4px; text-transform:uppercase; color:#0a0705;
  background:linear-gradient(180deg, #e0c060 0%, #c8a030 40%, #a07820 100%);
  border:none; border-radius:2px; cursor:pointer; transition:all 0.15s;
  box-shadow:0 2px 8px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
}
.collect-btn:hover:not(:disabled) {
  background:linear-gradient(180deg, #f0d070 0%, #d8b040 40%, #b08830 100%);
  box-shadow:0 4px 18px rgba(200,169,81,0.35), inset 0 1px 0 rgba(255,255,255,0.25);
  transform:translateY(-1px);
}
.collect-btn:disabled { opacity:0.4; cursor:default; background:#3a2a15; color:var(--text-dim); box-shadow:none; }

.collect-form { display:none; margin-top:16px; }
.collect-form.visible { display:block; animation:fadeIn 0.3s ease-out; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

.form-label {
  font-family:'Cinzel',serif; font-size:10px; letter-spacing:2px;
  color:var(--text-dim); text-transform:uppercase; margin-bottom:5px; display:block;
}
.form-label .req { color:var(--blood-light); }
.form-input {
  width:100%; background:#0d0906; border:1px solid var(--border-color);
  color:var(--text-main); font-family:'IM Fell English',serif; font-size:15px;
  padding:11px 14px; border-radius:2px; outline:none; margin-bottom:14px;
  transition:border-color 0.15s;
}
.form-input:focus { border-color:var(--gold-dark); box-shadow:0 0 8px rgba(200,169,81,0.12); }
.form-input::placeholder { color:rgba(90,63,30,0.5); font-style:italic; }

.form-hint { font-size:13px; color:var(--text-dim); font-style:italic; margin:-8px 0 14px; opacity:0.7; }

.collect-status {
  margin-top:14px; padding:12px 16px; border-radius:2px;
  font-family:'Cinzel',serif; font-size:11px; letter-spacing:1px; text-align:center;
  display:none;
}
.collect-status.success { background:rgba(40,100,40,0.25); border:1px solid rgba(68,187,68,0.4); color:var(--set-green); display:block; }
.collect-status.error { background:rgba(100,0,0,0.25); border:1px solid rgba(139,0,0,0.4); color:#ff6666; display:block; }
.collect-status.info { background:rgba(40,60,100,0.2); border:1px solid rgba(102,153,204,0.3); color:var(--magic-blue); display:block; }

/* Success collected panel */
.collected-panel {
  text-align:center; padding:20px; margin-top:20px;
  background:rgba(40,100,40,0.12); border:1px solid rgba(68,187,68,0.3); border-radius:2px;
  display:none;
}
.collected-panel.visible { display:block; animation:fadeIn 0.4s ease-out; }
.collected-deco { font-size:32px; color:var(--set-green); margin-bottom:12px; }
.collected-title { font-family:'Cinzel',serif; font-size:15px; letter-spacing:2px; color:var(--set-green); margin-bottom:10px; }
.collected-detail { font-size:14px; color:var(--text-main); line-height:1.7; }
.collected-detail strong { color:var(--gold-light); }
.collected-uid { font-family:'Cinzel',serif; font-size:12px; letter-spacing:1px; color:var(--gold); margin-top:10px; }

.footer-note {
  text-align:center; font-family:'Cinzel',serif; font-size:8px;
  letter-spacing:2px; color:rgba(90,63,30,0.5); text-transform:uppercase;
  margin-top:24px;
}
</style>
</head>
<body>
<div class="collect-wrap">
  <div class="brand">
    <div class="brand-title">☠ Cursed Reliquary</div>
    <div class="brand-sub">A Relic Has Been Shared With You</div>
  </div>

  <div class="card-shell" id="card-shell">
    <div class="state-msg" id="loading-state">
      <div class="state-deco">⚗</div>
      <div class="state-title">Unsealing the Relic…</div>
      <div class="state-body">Retrieving item from the archive.</div>
    </div>
  </div>

  <div class="footer-note">Cursed Effects Archive · Shared Relic Protocol</div>
</div>

<script>
// ========================
// SUPABASE CONFIG
// ========================
const SUPABASE_URL = 'https://mhlwfevnjpezaaocbwwr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1obHdmZXZuanBlemFhb2Nid3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3OTA1NjcsImV4cCI6MjA5NjM2NjU2N30.pIpC9ZrNTd16_A0aLl6TPokhEshElq0dNrMNwyMEJg0';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const RARITY_CONFIG = {
  common:{label:'Common',badge:'badge-common',color:'#b8b8b8'},
  uncommon:{label:'Uncommon',badge:'badge-uncommon',color:'#6699cc'},
  rare:{label:'Rare',badge:'badge-rare',color:'#ffdd44'},
  corrupted:{label:'Corrupted',badge:'badge-corrupted',color:'#9966cc'},
  extremelyRare:{label:'Extremely Rare',badge:'badge-er',color:'#ff8844'},
  mythical:{label:'Mythical',badge:'badge-myth',color:'#ff5588'},
  legendary:{label:'Legendary',badge:'badge-leg',color:'#ffaa33'},
  paradigm:{label:'Paradigm',badge:'badge-para',color:'#44ddcc'},
  nebulith:{label:'Nebulith',badge:'badge-neb',color:'#aa88ff'},
  subumbral:{label:'Subumbral',badge:'badge-sub',color:'#8877aa'},
  faeBound:{label:'Fae Bound',badge:'badge-fae',color:'#88ffcc'},
  animalBound:{label:'Animal Bound',badge:'badge-animal',color:'#ccaa66'},
  lesserMage:{label:'Lesser Mage Bound',badge:'badge-mage',color:'#99bbdd'},
  humanBound:{label:'Human Bound',badge:'badge-human',color:'#ddbb99'},
  unknown:{label:'Unknown',badge:'badge-unknown',color:'#888888'}
};
const TIER_LABELS = ['Trace','Mild','Moderate','Severe','Critical','Absolute'];
const TIER_VALS = ['I','II','III','IV','V','VI'];
const DOMAIN_LABELS = { S:'Somatic', C:'Cognitive', E:'Environmental', M:'Metaphysical',
  Somatic:'Somatic', Cognitive:'Cognitive', Environmental:'Environmental', Metaphysical:'Metaphysical' };

let currentShare = null;
let currentSnapshot = null;
let currentUser = null;
let currentUserName = '';

// ========================
// GET SHARE TOKEN FROM URL
// ========================
function getShareToken() {
  const params = new URLSearchParams(window.location.search);
  return params.get('s') || params.get('share') || null;
}

// ========================
// LOAD SHARE
// ========================
async function loadShare() {
  const token = getShareToken();
  if (!token) {
    showError('No Relic Specified', 'This link is missing a share code. Please check the link and try again.');
    return;
  }

  // Check auth session
  const { data: { session } } = await db.auth.getSession();
  currentUser = session ? session.user : null;

  try {
    const { data: share, error } = await db
      .from('shared_links')
      .select('*')
      .eq('share_token', token)
      .single();

    if (error || !share) {
      showError('Relic Not Found', 'This shared relic could not be located in the archive. The link may be invalid or the share may have been removed.');
      return;
    }

    currentShare = share;
    currentSnapshot = share.item_snapshot;
    renderItem(share);
  } catch(e) {
    showError('Archive Error', 'Could not connect to the archive. Please try again shortly.');
    console.error(e);
  }
}

// ========================
// RENDER ITEM
// ========================
function renderItem(share) {
  const snap = share.item_snapshot;
  const remaining = share.total_copies - share.claimed_copies;
  const exhausted = remaining <= 0;
  // Resolve current user's display name (best-effort)
  if (currentUser) {
    currentUserName = currentUser.user_metadata?.display_name || currentUser.email || 'Collector';
  }

  const cfg = RARITY_CONFIG[snap.rarity] || RARITY_CONFIG.common;

  // Determine fields (handle both generated + manual snapshots)
  const isManual = !!snap.item_name || !!snap.primary_effect_name;
  const officialName = snap.item_name || snap.base_type || share.source_uid;
  const baseType = snap.base_type || '';
  const rarity = cfg.label;

  // Curse line
  let curseLine = '';
  if (isManual) {
    curseLine = [snap.curse_type_label, snap.curse_type_subtype].filter(Boolean).join(' — ');
    if (snap.domain) curseLine += (curseLine ? ' · ' : '') + (DOMAIN_LABELS[snap.domain] || snap.domain) + ' Domain';
  } else if (snap.curse_type) {
    const ct = snap.curse_type;
    curseLine = [ct.label, ct.subtype].filter(Boolean).join(' — ');
    if (snap.domain) curseLine += (curseLine ? ' · ' : '') + (DOMAIN_LABELS[snap.domain] || snap.domain) + ' Domain';
  }

  // Effect
  let effectName='', effectDesc='', effectPenalty='';
  if (isManual) {
    effectName = snap.primary_effect_name || '';
    effectDesc = snap.primary_effect_desc || '';
    effectPenalty = snap.primary_effect_penalty || '';
  } else if (snap.effects && snap.effects.length) {
    const eff = snap.effects[0];
    effectName = eff.name || '';
    effectDesc = eff.shortDesc || eff.desc || '';
    effectPenalty = eff.penalty || '';
  }

  const intensity = snap.intensity ?? 0;

  // Bound entity
  let boundHtml = '';
  if (isManual && snap.bound && snap.bound_entity_name) {
    boundHtml = `<div class="divider"></div>
      <div class="section-head" style="color:#88ffbb;">Bound Entity</div>
      <div class="item-name" style="font-size:17px;color:#b8ffe0;text-align:left;margin-bottom:4px;">${esc(snap.bound_entity_name)}</div>
      <div class="effect-desc" style="color:#aae8cc;font-style:italic;">${esc(snap.bound_entity_desc||'')}</div>`;
  } else if (!isManual && snap.bound && snap.bound_entity) {
    const be = snap.bound_entity;
    boundHtml = `<div class="divider"></div>
      <div class="section-head" style="color:#88ffbb;">Bound Entity</div>
      <div class="item-name" style="font-size:17px;color:#b8ffe0;text-align:left;margin-bottom:4px;">${esc(be.Name||'Unknown')}</div>
      <div class="effect-desc" style="color:#aae8cc;font-style:italic;">${esc(be.Description||'')}</div>`;
  }

  const loreHtml = snap.lore ? `<div class="lore-block">${esc(snap.lore)}</div>` : '';
  const notesHtml = snap.notes ? `<div class="lore-block" style="border-color:rgba(90,63,30,0.4);">${esc(snap.notes)}</div>` : '';

  const effectHtml = effectName ? `
    <div class="section-head">${(snap.domain?(DOMAIN_LABELS[snap.domain]||snap.domain)+' · ':'')}${esc(effectName)}</div>
    <div class="effect-desc">${esc(effectDesc)}</div>
    ${effectPenalty ? `<div class="effect-penalty">⚠ ${esc(effectPenalty)}</div>` : ''}` : '';

  const shell = document.getElementById('card-shell');
  shell.innerHTML = `
    <div class="share-badge">
      ☩ Shared Relic
      <span class="copies-remaining">${exhausted ? 'All copies collected' : remaining + ' of ' + share.total_copies + ' remaining'}</span>
    </div>
    <div class="sprite-frame"><canvas id="sprite-canvas" width="96" height="96"></canvas></div>
    <div style="text-align:center;">
      <span class="item-tier-badge" style="border:1px solid ${cfg.color}66;color:${cfg.color};background:${cfg.color}11;">${rarity}</span>
    </div>
    <div class="item-name">${esc(officialName)}</div>
    <div class="item-base">${esc(baseType)}</div>
    ${curseLine ? `<div class="item-curse">${esc(curseLine)}</div>` : ''}
    <div class="divider"></div>
    ${effectHtml}
    ${boundHtml}
    <div class="meta-line">Intensity — ${TIER_LABELS[intensity]||''} (${TIER_VALS[intensity]||''}) · UID ${esc(share.source_uid)}</div>
    ${loreHtml}
    ${notesHtml}

    <div class="collect-section">
      ${exhausted ? `
        <button class="collect-btn" disabled>This item has already been collected.</button>
      ` : (!currentUser ? `
        <button class="collect-btn" onclick="goToLogin()">☩ Log In to Collect</button>
        <div class="form-hint" style="text-align:center;margin-top:12px;">You must have a collector account to claim this relic.</div>
      ` : `
        <button class="collect-btn" id="collect-btn" onclick="showCollectForm()">☩ Collect This Item</button>
        <div class="collect-form" id="collect-form">
          <div class="form-hint" style="margin-top:0;margin-bottom:14px;color:var(--gold-light);opacity:0.9;">Collecting as <strong>${esc(currentUserName)}</strong></div>
          ${share.allow_title ? `
            <label class="form-label">Give This Item a Title</label>
            <input type="text" class="form-input" id="collector-title" placeholder="e.g. My Cursed Heirloom" maxlength="120" autocomplete="off" />
            <div class="form-hint">This custom title is yours alone — the item keeps its official name too.</div>
          ` : `
            <div class="form-hint" style="margin-bottom:14px;">This item cannot be given a title.</div>
          `}
          <button class="collect-btn" id="confirm-collect-btn" onclick="collectItem(${share.allow_title})">Confirm &amp; Collect</button>
          <div class="collect-status" id="collect-status"></div>
        </div>
      `)}
    </div>

    <div class="collected-panel" id="collected-panel">
      <div class="collected-deco">✦</div>
      <div class="collected-title">Item Collected</div>
      <div class="collected-detail" id="collected-detail"></div>
      <div class="collected-uid" id="collected-uid"></div>
    </div>
  `;

  // Paint sprite from snapshot's image_uid seed
  paintSprite(snap);
}

// ========================
// SPRITE PAINTING (uses stored image_uid if the engine is available;
// otherwise draws a simple seeded placeholder)
// ========================
function paintSprite(snap) {
  const canvas = document.getElementById('sprite-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  // Seeded placeholder sprite from uid — deterministic 16x16 blocky glyph
  const seedStr = (snap.image_uid || snap.archival_id || snap.uid_code || 'relic');
  let seed = 0;
  for (let i=0;i<seedStr.length;i++) seed = (seed*31 + seedStr.charCodeAt(i)) >>> 0;
  function rng(){ seed = (seed*1664525 + 1013904223) >>> 0; return seed/4294967296; }

  const cfg = RARITY_CONFIG[snap.rarity] || RARITY_CONFIG.common;
  const grid = 16, cell = 96/grid;
  ctx.clearRect(0,0,96,96);
  // Build a symmetric pattern
  const base = cfg.color;
  for (let y=0;y<grid;y++){
    for (let x=0;x<Math.ceil(grid/2);x++){
      if (rng() > 0.55){
        const shade = 0.5 + rng()*0.5;
        ctx.fillStyle = shadeColor(base, shade);
        ctx.fillRect(x*cell, y*cell, cell, cell);
        ctx.fillRect((grid-1-x)*cell, y*cell, cell, cell);
      }
    }
  }
}
function shadeColor(hex, factor){
  const c = hex.replace('#','');
  const r = Math.min(255, Math.round(parseInt(c.substr(0,2),16)*factor));
  const g = Math.min(255, Math.round(parseInt(c.substr(2,2),16)*factor));
  const b = Math.min(255, Math.round(parseInt(c.substr(4,2),16)*factor));
  return `rgb(${r},${g},${b})`;
}

// ========================
// COLLECT FLOW
// ========================
function showCollectForm() {
  document.getElementById('collect-btn').style.display = 'none';
  document.getElementById('collect-form').classList.add('visible');
  document.getElementById('collector-username').focus();
}

function goToLogin() {
  const redirect = encodeURIComponent(window.location.href);
  window.location.href = 'account.html?redirect=' + redirect;
}

async function collectItem(allowTitle) {
  const titleEl = document.getElementById('collector-title');
  const title = (allowTitle && titleEl) ? (titleEl.value || '').trim() : '';
  const status = document.getElementById('collect-status');
  const btn = document.getElementById('confirm-collect-btn');

  btn.disabled = true;
  status.className = 'collect-status info';
  status.textContent = 'Binding the relic to your account…';

  try {
    const { data, error } = await db.rpc('claim_item_copy_auth', {
      p_share_token: currentShare.share_token,
      p_custom_title: title || null
    });

    if (error) throw error;

    const result = Array.isArray(data) ? data[0] : data;

    if (result.result_status === 'success') {
      // Hide form, show collected panel
      document.getElementById('collect-form').classList.remove('visible');
      const panel = document.getElementById('collected-panel');
      const detail = document.getElementById('collected-detail');
      const uidEl = document.getElementById('collected-uid');
      const officialName = currentSnapshot.item_name || currentSnapshot.base_type || currentShare.source_uid;
      detail.innerHTML = title
        ? `<strong>${esc(title)}</strong><br><span style="font-size:13px;color:var(--text-dim);">(${esc(officialName)})</span><br>now belongs to <strong>${esc(currentUserName)}</strong>.`
        : `<strong>${esc(officialName)}</strong><br>now belongs to <strong>${esc(currentUserName)}</strong>.`;
      uidEl.innerHTML = 'Your copy: ' + esc(result.result_copy_uid) +
        '<br><br><a href="collection.html" style="color:var(--gold);font-family:\'Cinzel\',serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;text-decoration:none;">View My Collection →</a>';
      panel.classList.add('visible');
    } else if (result.result_status === 'not_logged_in') {
      status.className = 'collect-status error';
      status.textContent = 'Your session expired. Please log in again.';
      setTimeout(goToLogin, 1200);
    } else if (result.result_status === 'already_owned') {
      status.className = 'collect-status error';
      status.textContent = 'You have already collected this item.';
      btn.disabled = false;
    } else if (result.result_status === 'exhausted') {
      status.className = 'collect-status error';
      status.textContent = 'This item has already been collected.';
      // Disable the whole thing
      setTimeout(() => location.reload(), 1500);
    } else {
      status.className = 'collect-status error';
      status.textContent = result.result_message || 'Collection failed.';
      btn.disabled = false;
    }
  } catch(e) {
    status.className = 'collect-status error';
    status.textContent = 'Collection failed: ' + (e.message || 'unknown error');
    btn.disabled = false;
    console.error(e);
  }
}

// ========================
// HELPERS
// ========================
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showError(title, body) {
  document.getElementById('card-shell').innerHTML = `
    <div class="state-msg">
      <div class="state-deco">✗</div>
      <div class="state-title">${esc(title)}</div>
      <div class="state-body">${esc(body)}</div>
    </div>`;
}

// BOOT
loadShare();
</script>
