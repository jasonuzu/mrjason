<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abracadabra/title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#ffcc33;--cyan:#6fe3ff;--pink:#ff5d7d;--panel:#13131f;--panel2:#0e0e1a;--line:#30304e;--txt:#e8e8f2}
html,body{min-height:100%}
body{font-family:'Press Start 2P','Courier New',monospace;color:var(--txt);background-color:#0a0a13;
 background-image:linear-gradient(45deg,#0e0e19 25%,transparent 25%,transparent 75%,#0e0e19 75%),
 linear-gradient(45deg,#0e0e19 25%,transparent 25%,transparent 75%,#0e0e19 75%);
 background-size:28px 28px;background-position:0 0,14px 14px}
header{display:flex;align-items:center;gap:14px;padding:14px 18px;background:#101020;border-bottom:4px solid var(--line);flex-wrap:wrap}
h1{font-size:17px;color:var(--gold);text-shadow:2px 2px 0 #7a4a00,4px 4px 0 #000;letter-spacing:2px}
.tag{font-size:7px;color:#8a8ab0;letter-spacing:1px}
.heart{display:inline-block;width:3px;height:3px;background:transparent;margin:8px 26px 0 6px;box-shadow:
 3px 0 var(--pink),6px 0 var(--pink),12px 0 var(--pink),15px 0 var(--pink),
 0 3px var(--pink),3px 3px var(--pink),6px 3px var(--pink),9px 3px var(--pink),12px 3px var(--pink),15px 3px var(--pink),18px 3px var(--pink),
 0 6px var(--pink),3px 6px var(--pink),6px 6px var(--pink),9px 6px var(--pink),12px 6px var(--pink),15px 6px var(--pink),18px 6px var(--pink),
 3px 9px var(--pink),6px 9px var(--pink),9px 9px var(--pink),12px 9px var(--pink),15px 9px var(--pink),
 6px 12px var(--pink),9px 12px var(--pink),12px 12px var(--pink),9px 15px var(--pink)}
.hspace{flex:1}
.btn{font-family:inherit;font-size:9px;padding:10px 12px;background:#24243c;color:#fff;border:0;cursor:pointer;
 box-shadow:inset -3px -3px 0 #12121f,inset 3px 3px 0 #3c3c60,0 0 0 2px #05050c;letter-spacing:1px}
.btn:hover{background:#2d2d4c}
.btn:active{transform:translateY(1px)}
.btn.gold{background:#6e5510;box-shadow:inset -3px -3px 0 #3c2e06,inset 3px 3px 0 #a8862a,0 0 0 2px #05050c;color:#ffe9a0}
.btn.gold:hover{background:#82661a}
.btn.big{font-size:11px;padding:13px 18px}
.btn.mini{font-size:8px;padding:8px 10px}
input[type=range]{accent-color:var(--gold);cursor:pointer}
.chk{font-size:8px;color:#aab;display:flex;align-items:center;gap:5px;cursor:pointer}
.chk input{accent-color:var(--gold)}
main{display:grid;grid-template-columns:1fr 400px;gap:18px;padding:18px;max-width:1560px;margin:0 auto;align-items:start}
@media(max-width:1080px){main{grid-template-columns:1fr}}
#stageCol{display:flex;flex-direction:column;gap:10px;min-width:0}
.pbox{background:var(--panel);border:3px solid var(--line);box-shadow:0 0 0 3px #05050c}
#statusBar{font-size:8px;color:#9a9ac0;padding:9px 12px;letter-spacing:1px}
#stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;cursor:pointer;--px:8px}
#bgCanvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#lightFx{position:absolute;inset:0;pointer-events:none;z-index:3}
#scanFx{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:.5;
 background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 2px,transparent 2px 4px)}
#stageVignette{position:absolute;inset:0;pointer-events:none;z-index:5;box-shadow:inset 0 0 70px rgba(0,0,0,.55)}
.fx-night{background:rgba(16,26,120,.42)}
.fx-dusk{background:rgba(255,110,30,.22)}
.fx-candle{background:rgba(255,150,50,.16);animation:candle 2.1s steps(10) infinite}
.fx-storm{background:rgba(6,10,30,.5);animation:storm 6.5s linear infinite}
@keyframes candle{0%,100%{opacity:.7}22%{opacity:1}47%{opacity:.55}71%{opacity:.95}86%{opacity:.8}}
@keyframes storm{0%,86%,93%,100%{background:rgba(6,10,30,.5)}88%{background:rgba(225,238,255,.55)}89.5%{background:rgba(6,10,30,.5)}91%{background:rgba(225,238,255,.4)}}
#sceneUI{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:3%}
#picWindow{display:none;background:#05050f;padding:3px;margin-bottom:14px;box-shadow:6px 6px 0 rgba(0,0,0,.45)}
#picWindow.show{display:block;animation:pop .16s steps(3)}
@keyframes pop{from{transform:scale(.5)}to{transform:scale(1)}}
#picMid{background:#e8e8f4;padding:3px}
#storyPic{display:block;height:calc(var(--px)*30);max-width:calc(var(--px)*66);width:auto;image-rendering:pixelated;background:#111}
#dialogWrap{width:86%;background:#05050f;padding:3px;box-shadow:6px 6px 0 rgba(0,0,0,.45)}
#dialogMid{background:#e8e8f4;padding:3px}
#dialogInner{background:#10102c;padding:14px 16px;min-height:7.5em;font-size:calc(var(--px)*2.3);line-height:2;
 text-shadow:2px 2px 0 rgba(0,0,0,.85);word-break:break-word;
 box-shadow:inset 3px 3px 0 rgba(255,255,255,.07),inset -3px -3px 0 rgba(0,0,0,.4)}
#cursor{margin-left:5px;animation:blink .85s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#endCard{position:absolute;inset:0;z-index:7;display:none;flex-direction:column;gap:20px;align-items:center;justify-content:center;
 background:rgba(0,0,0,.6);color:var(--gold);font-size:calc(var(--px)*4.2);text-shadow:3px 3px 0 #000;letter-spacing:4px}
#endCard.show{display:flex}
#endCard small{font-size:calc(var(--px)*1.2);color:#cfcfe8;animation:blink 1s steps(1) infinite}
#playHint{position:absolute;right:10px;bottom:8px;z-index:6;display:none;font-size:calc(var(--px)*1.1);color:rgba(255,255,255,.55)}
body.playing #playHint{display:block}
body.playing #editor{display:none}
body.playing main{grid-template-columns:1fr}
body.playing #stageCol{align-items:center}
body.playing #stage{width:min(100%,calc((100vh - 170px)*16/9))}
#editor{padding:14px;display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 120px);overflow-y:auto;position:sticky;top:14px}
#editor::-webkit-scrollbar{width:10px}
#editor::-webkit-scrollbar-thumb{background:#30304e;border:2px solid #05050c}
.sec{border:2px solid var(--line);background:var(--panel2);padding:12px}
.sec h2{font-size:9px;color:var(--gold);letter-spacing:1px;margin-bottom:11px;text-shadow:2px 2px 0 #000}
.row{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}
.lbl{font-size:8px;color:#aab;white-space:nowrap}
.val{font-size:9px;color:var(--cyan);min-width:16px}
.note{font-size:7px;color:#66668c;line-height:1.8;margin-top:9px}
#bgGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bgCard{border:3px solid var(--line);cursor:pointer;background:#000;padding:0;font-family:inherit;color:#aab}
.bgCard canvas{display:block;width:100%;image-rendering:pixelated}
.bgCard span{display:block;font-size:6px;padding:4px 1px;text-align:center;background:#101020;font-family:inherit}
.bgCard.sel{border-color:var(--gold);box-shadow:0 0 10px rgba(255,204,51,.35)}
#lineList{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.line{border:2px solid var(--line);background:#101020;padding:8px}
.line-top{display:flex;align-items:center;gap:6px;margin-bottom:7px;flex-wrap:wrap}
.lnum{font-size:9px;color:var(--gold);min-width:20px}
.line input[type=color]{width:30px;height:24px;border:2px solid var(--line);background:#000;padding:1px;cursor:pointer}
.line select{font-family:inherit;font-size:7px;background:#181830;color:#ddd;border:2px solid var(--line);padding:4px;max-width:130px}
.spacer{flex:1}
.ibtn{font-family:inherit;font-size:8px;width:24px;height:24px;background:#24243c;color:#fff;border:0;cursor:pointer;box-shadow:0 2px 0 #05050c}
.ibtn:hover{background:#33335a}
.ibtn.del:hover{background:#5e2434}
.line textarea{width:100%;font-family:inherit;font-size:9px;line-height:1.9;background:#0b0b16;color:#fff;border:2px solid var(--line);padding:8px;resize:vertical;min-height:52px}
.line textarea:focus{outline:none;border-color:var(--cyan)}
.fxbtn{font-family:inherit;font-size:7px;padding:8px 9px;background:#1c1c30;color:#bbc;border:2px solid var(--line);cursor:pointer}
.fxbtn:hover{border-color:#55558a}
.fxbtn.on{background:#41325e;border-color:var(--gold);color:#ffe9a0}
#imgGrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.thumb{border:3px solid var(--line);background:#000;width:88px}
.thumb img{display:block;width:100%;height:56px;object-fit:cover;image-rendering:pixelated}
.tname{font-size:6px;padding:4px 2px;text-align:center;color:#aab;white-space:nowrap;overflow:hidden}
.tbtns{display:flex;gap:3px;padding:0 4px 4px}
.tbtns button{flex:1;font-family:inherit;font-size:6px;padding:4px 0;background:#22223a;color:#fff;border:0;cursor:pointer;box-shadow:0 2px 0 #05050c}
.tbtns button:hover{background:#31425e}
.tbtns button.del:hover{background:#5e2434}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#000;border:3px solid var(--gold);
 color:var(--gold);padding:11px 16px;font-size:9px;display:none;z-index:99;letter-spacing:1px}
#errBanner{display:none;position:fixed;top:0;left:0;right:0;z-index:999;background:#5e1020;color:#ffd0d0;
 border-bottom:3px solid #ff5d7d;padding:10px 14px;font-size:9px;line-height:1.7;font-family:monospace}
footer{text-align:center;font-size:7px;color:#4a4a6a;padding:14px;letter-spacing:1px}
</style>
<script>
window.addEventListener('error', function(e){
  var b=document.getElementById('errBanner');
  if(b){ b.style.display='block'; b.textContent='JS ERROR: '+(e.message||'unknown')+' (line '+(e.lineno||'?')+')'; }
});
</script>
</head>
<body>
<div id="errBanner"></div>

<header>
  <span class="heart"></span>
  <h1>ABRACADABRA</h1>
  <span class="tag">The Tale of Thalen</span>
  <div class="hspace"></div>
  <button class="btn mini" id="sfxBtn" type="button">SFX ON</button>
  <button class="btn gold big" id="playBtn" type="button">&#9654; PLAY STORY</button>
</header>

<main>
  <div id="stageCol">
    <div id="stage" class="pbox">
      <canvas id="bgCanvas" width="320" height="180"></canvas>
      <div id="lightFx"></div>
      <div id="scanFx"></div>
      <div id="stageVignette"></div>
      <div id="sceneUI">
        <div id="picWindow"><div id="picMid"><img id="storyPic" alt=""></div></div>
        <div id="dialogWrap"><div id="dialogMid"><div id="dialogInner"><span id="dialogText"></span><span id="cursor" style="visibility:hidden">&#9660;</span></div></div></div>
      </div>
      <div id="endCard">&#10022; THE END &#10022;<small>CLICK OR PRESS ESC</small></div>
      <div id="playHint">CLICK / SPACE = NEXT</div>
    </div>
    <div id="statusBar" class="pbox">BOOTING...</div>
  </div>

  <aside id="editor" class="pbox">
    <div class="sec">
      <h2>BACKGROUND</h2>
      <div id="bgGrid"></div>
      <div class="row">
        <button class="btn mini" id="bgUploadBtn" type="button">UPLOAD BG</button>
        <label class="chk"><input type="checkbox" id="pixelChk" checked>PIXELATE</label>
        <button class="btn mini" id="bgClearBtn" type="button" style="display:none">CLEAR</button>
      </div>
      <div class="note" id="bgNote">PICK A PRESET WORLD, OR UPLOAD JPG/PNG/GIF/WEBP (ANIMATED GIFS OK)</div>
    </div>

    <div class="sec">
      <h2>STORY LINES</h2>
      <div id="lineList"></div>
      <button class="btn gold" id="addLine" type="button">+ ADD LINE</button>
      <div class="note">ORDER = PLAYBACK ORDER · PICK INK COLOR + PICTURE PER LINE</div>
    </div>

    <div class="sec">
      <h2>REVEAL &amp; LIGHTING</h2>
      <div class="row"><span class="lbl">TEXT SPEED</span><input type="range" id="speed" min="1" max="10" value="5" style="flex:1"><span class="val" id="speedVal">5</span></div>
      <div class="row" id="fxRow">
        <button class="fxbtn on" data-fx="none" type="button">NONE</button>
        <button class="fxbtn" data-fx="night" type="button">NIGHT</button>
        <button class="fxbtn" data-fx="dusk" type="button">DUSK</button>
        <button class="fxbtn" data-fx="candle" type="button">CANDLE</button>
        <button class="fxbtn" data-fx="storm" type="button">STORM</button>
      </div>
      <div class="row">
        <label class="chk"><input type="checkbox" id="scanChk" checked>CRT SCANLINES</label>
        <label class="chk"><input type="checkbox" id="autoChk">AUTO-NEXT</label>
      </div>
    </div>

    <div class="sec">
      <h2>PICTURES</h2>
      <button class="btn mini" id="imgUploadBtn" type="button">UPLOAD PICTURES</button>
      <div id="imgGrid"></div>
      <div class="note">ASSIGNED PICTURES APPEAR IN A FRAME ABOVE THE TEXT BOX</div>
    </div>

    <div class="sec">
      <h2>MUSIC</h2>
      <div class="row">
        <button class="btn mini" id="musicBtn" type="button">UPLOAD MP3</button>
        <span class="note" id="musicName" style="margin:0">NO TRACK LOADED</span>
      </div>
      <div class="row"><span class="lbl">VOL</span><input type="range" id="vol" min="0" max="100" value="70" style="flex:1"></div>
    </div>
  </aside>
</main>

<footer>SPACE / ENTER / CLICK = ADVANCE · ESC = STOP</footer>

<input type="file" id="bgFileInput" accept="image/*" hidden>
<input type="file" id="imgFileInput" accept="image/*" multiple hidden>
<input type="file" id="musicFileInput" accept="audio/*" hidden>
<div id="toast"></div>

<script>
(function(){
'use strict';

var W=320, H=180;
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function makeRand(seed){ var s=seed>>>0; return function(){ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function bands(c,cols,y0,y1){ var n=cols.length,h=(y1-y0)/n; for(var i=0;i<n;i++){ c.fillStyle=cols[i]; c.fillRect(0,Math.floor(y0+i*h),W,Math.ceil(h)+1); } }
function circle(c,x,y,r,col){ c.fillStyle=col; for(var j=-r;j<=r;j++){ var w=Math.floor(Math.sqrt(r*r-j*j)); if(w>=0) c.fillRect(Math.round(x-w),Math.round(y+j),w*2+1,1); } }
function diamond(c,x,y,s,col){ c.fillStyle=col; for(var j=-s;j<=s;j++){ var w=s-Math.abs(j); c.fillRect(Math.round(x-w),Math.round(y+j),w*2+1,1); } }
function pine(c,x,base,h,w,col){ c.fillStyle=col; for(var i=0;i<3;i++){ var th=h/3+2, ty=base-h+i*(h/3), tw=w*(0.45+0.55*(i+1)/3); for(var yy=0;yy<th;yy++){ var ww=Math.max(1,tw*(yy/th)); c.fillRect(Math.round(x-ww/2),Math.round(ty+yy),Math.round(ww),1); } } }

/* ---------- animated pixel backgrounds ---------- */
var BG={};

BG.starlight={name:'STARLIGHT RIDGE',
 build:function(){ var r=makeRand(99), self=this;
  this.stars=[]; for(var i=0;i<70;i++) this.stars.push({x:(r()*W)|0,y:(r()*105)|0,p:r()*6.28,b:r()<.25});
  function mk(base,amp){ var a=[],h=base; for(var x=0;x<W;x++){ h+=(r()-.5)*amp; h=Math.max(base-16,Math.min(base+16,h)); a.push(h);} return a; }
  this.far=mk(104,5); this.near=mk(126,7);
  this.lights=[[46,'#ffb54d'],[152,'#ffb54d'],[268,'#ff8a5a']]; },
 draw:function(c,t){
  bands(c,['#050514','#0a0a26','#12103c','#1c1650'],0,112);
  circle(c,246,36,15,'rgba(226,226,198,.08)'); circle(c,246,36,10,'#e9e6cf');
  c.fillStyle='#cfcbb2'; c.fillRect(242,33,3,3); c.fillRect(248,38,2,2); c.fillRect(250,31,2,2);
  for(var i=0;i<this.stars.length;i++){ var s=this.stars[i], a=(.3+.7*Math.abs(Math.sin(t*1.5+s.p))).toFixed(2);
   c.fillStyle=s.b?('rgba(150,190,255,'+a+')'):('rgba(255,255,255,'+a+')'); c.fillRect(s.x,s.y,s.b?2:1,s.b?2:1); }
  var ph=t%9;
  if(ph<.8){ var sx=330-ph*300, sy=14+ph*62;
   for(var k=0;k<8;k++){ c.fillStyle='rgba(255,255,255,'+((1-k/8)*.9).toFixed(2)+')'; c.fillRect(sx+k*3,sy-k,2,1); } }
  c.fillStyle='#181646'; for(var x=0;x<W;x++){ var y=this.far[x]|0; c.fillRect(x,y,1,H-y); }
  c.fillStyle='#0a0922'; for(var x2=0;x2<W;x2++){ var y2=this.near[x2]|0; c.fillRect(x2,y2,1,H-y2); }
  for(var li=0;li<this.lights.length;li++){ var lx=this.lights[li][0], col=this.lights[li][1];
   var ly=(this.near[lx]|0)-3, la=.55+.45*Math.sin(t*3+lx);
   c.fillStyle='rgba(255,180,80,'+(.25*la).toFixed(2)+')'; c.fillRect(lx-2,ly-2,5,5);
   c.globalAlpha=la; c.fillStyle=col; c.fillRect(lx,ly,1,2); c.globalAlpha=1; }
 }};

BG.forest={name:'WHISPER WOODS',
 build:function(){ var r=makeRand(5);
  this.farT=[]; this.nearT=[]; this.flies=[];
  for(var i=0;i<15;i++) this.farT.push({x:r()*W,h:18+r()*14,w:9+r()*6});
  for(var j=0;j<9;j++) this.nearT.push({x:r()*W,h:36+r()*26,w:16+r()*9});
  for(var k=0;k<16;k++) this.flies.push({x:r()*W,y:70+r()*86,ph:r()*6.28,sp:.5+r()*1.2}); },
 draw:function(c,t){
  bands(c,['#03140d','#072718','#0b3a22'],0,H-24);
  c.fillStyle='#04120b'; c.fillRect(0,H-24,W,24);
  var i;
  for(i=0;i<this.farT.length;i++){ var f=this.farT[i]; pine(c,f.x,H-24,f.h,f.w,'#0b2a19'); }
  for(i=0;i<this.nearT.length;i++){ var n=this.nearT[i]; pine(c,n.x,H+3,n.h,n.w,'#071a0f'); }
  c.fillStyle='rgba(2,10,6,.5)'; c.fillRect(0,0,W,10);
  for(i=0;i<this.flies.length;i++){ var fl=this.flies[i];
   var x=fl.x+Math.sin(t*fl.sp+fl.ph)*11, y=fl.y+Math.cos(t*fl.sp*.7+fl.ph*2)*6;
   var a=.35+.65*Math.abs(Math.sin(t*2.2+fl.ph));
   c.fillStyle='rgba(210,255,120,'+(a*.22).toFixed(2)+')'; c.fillRect(x-2,y-2,5,5);
   c.fillStyle='rgba(235,255,170,'+a.toFixed(2)+')'; c.fillRect(x,y,1,1); }
 }};

BG.sea={name:'MOONLIT SEA',
 build:function(){ var r=makeRand(14);
  this.stars=[]; this.rows=[];
  for(var i=0;i<26;i++) this.stars.push({x:(r()*W)|0,y:(r()*48)|0,p:r()*6.28});
  for(var j=0;j<12;j++) this.rows.push({y:106+j*6,seed:r()*W,sp:8+j*2.2}); },
 draw:function(c,t){
  bands(c,['#03081a','#071230','#0c1e46'],0,104);
  var i;
  for(i=0;i<this.stars.length;i++){ var s=this.stars[i], a=.3+.7*Math.abs(Math.sin(t*1.3+s.p));
   c.fillStyle='rgba(255,255,255,'+a.toFixed(2)+')'; c.fillRect(s.x,s.y,1,1); }
  circle(c,84,30,13,'rgba(210,225,255,.10)'); circle(c,84,30,9,'#dfe6f2');
  c.fillStyle='#b9c4d8'; c.fillRect(81,27,2,2); c.fillRect(87,33,2,2);
  c.fillStyle='#0a1c40'; c.fillRect(0,104,W,H-104);
  c.fillStyle='#123060'; c.fillRect(0,104,W,1);
  for(i=0;i<this.rows.length;i++){ var rw=this.rows[i];
   for(var k=0;k<6;k++){
    var x=((rw.seed+k*(W/6)+t*rw.sp)%(W+16))-8;
    c.fillStyle='rgba(58,106,166,.85)'; c.fillRect(x,rw.y,10,1);
    if(k%2===0){ c.fillStyle='rgba(146,196,240,.6)'; c.fillRect(((x+23)%(W+10))-5,rw.y+2,5,1); } } }
  for(i=0;i<10;i++){ var y=107+i*7, wob=Math.sin(t*2.4+i)*3, w=9-i*.5;
   c.fillStyle='rgba(200,220,255,'+(.5-i*.04).toFixed(2)+')'; c.fillRect(84-w/2+wob,y,w,1); }
 }};

BG.keep={name:'TORCHLIT KEEP',
 build:function(){ var r=makeRand(31); this.bricks=[];
  for(var row=0;row<12;row++){ var off=(row%2)*16;

BG.city={name:'NEON RAIN CITY',

   for(var wy=8;wy<h-8;wy+=9) for(var wx=3;wx<w-4;wx+=7) if(r()<.42) wins.push({wx:wx,wy:wy,on:r()<.75,ph:r()*9});
   this.bld.push({x:x,w:w,h:h,col:r()<.5?'#131a2b':'#0f1523',wins:wins});

  c.fillStyle='rgba(255,93,125,'+(.6+.4*Math.sin(t*4)).toFixed(2)+')'; c.fillRect(30,gy-64,14,5);

/* ---------- state ---------- */
var state={
 bg:'starlight', pixelate:true,

/* ---------- element refs ---------- */

 clearTimeout(toastTimer); toastTimer=setTimeout(function(){ el.style.display='none'; },2200); }

window.addEventListener('resize',fitStage);

/* ---------- stage render loop ---------- */
var frameErrShown=false;
function frame(ts){
 var t=ts/1000;
 try{
  if(customImg){
   if(state.pixelate){ tctx.drawImage(customImg,0,0,128,72); bctx.imageSmoothingEnabled=false; bctx.drawImage(tmp,0,0,W,H); }
   else{ bctx.imageSmoothingEnabled=true; bctx.drawImage(customImg,0,0,W,H); }
  }else{
   bctx.imageSmoothingEnabled=false; BG[state.bg].draw(bctx,t);
  }
 }catch(err){
  if(!frameErrShown){ frameErrShown=true; toast('BG ERROR: '+err.message); }
 }
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- background grid ---------- */
var thumbJobs=[];
(function buildBgGrid(){
 for(var key in BG){
  (function(key){
   var b=document.createElement('button'); b.className='bgCard'; b.dataset.bg=key; b.type='button';
   var cv=document.createElement('canvas'); cv.width=96; cv.height=54;
   var sp=document.createElement('span'); sp.textContent=BG[key].name;
   b.appendChild(cv); b.appendChild(sp); bgGrid.appendChild(b);
   var tc=cv.getContext('2d'); tc.imageSmoothingEnabled=false; tc.scale(96/W,54/H);
   thumbJobs.push({c:tc,key:key});
   b.addEventListener('click',function(){ state.bg=key; customImg=null; updateBgUI(); });
  })(key);
 }
 setInterval(function(){
  if(document.body.classList.contains('playing')) return;
  try{ var t=performance.now()/1000;
   for(var i=0;i<thumbJobs.length;i++) BG[thumbJobs[i].key].draw(thumbJobs[i].c,t);
  }catch(err){}
 },180);
})();

/* ---------- sfx ---------- */
var AC=null;
function blip(){
 if(!state.sfx) return;
 try{
  if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended') AC.resume();
  var o=AC.createOscillator(), g=AC.createGain();
  o.type='square'; o.frequency.value=560+Math.random()*140;
  g.gain.setValueAtTime(.045,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.06);
  o.connect(g); g.connect(AC.destination);
  o.start(); o.stop(AC.currentTime+.07);
 }catch(err){}
}

/* ---------- playback engine ---------- */
var playing=false, ended=false, typing=false, waiting=false;
var lineIdx=0, words=[], wi=0, typeTimer=null, autoTimer=null;
function wordDelay(){ return Math.max(70,780-state.speed*66); }
function pushWord(w){
 var s=document.createElement('span'); s.textContent=w;
 dialogText.appendChild(s); dialogText.appendChild(document.createTextNode(' '));
}
function startPlay(){
 var hasText=false;
 for(var i=0;i<state.lines.length;i++) if(state.lines[i].text.trim()) hasText=true;
 if(!hasText){ toast('ADD AT LEAST ONE LINE OF TEXT!'); return; }
 document.body.classList.add('playing');
 playBtn.textContent='[STOP]'; playing=true; ended=false;
 playBtn.blur();
 requestAnimationFrame(fitStage);
 if(audio.src){ audio.volume=state.volume; audio.currentTime=0; audio.play().catch(function(){}); }
 lineIdx=-1; nextLine();
}
function nextLine(){
 if(!playing) return;
 lineIdx++;
 while(lineIdx<state.lines.length && !state.lines[lineIdx].text.trim()) lineIdx++;
 if(lineIdx>=state.lines.length){ endStory(); return; }
 var L=state.lines[lineIdx], im=null;
 for(var i=0;i<state.images.length;i++) if(state.images[i].id===L.img) im=state.images[i];
 if(im){ storyPic.src=im.url; picWindow.classList.add('show'); }
 else picWindow.classList.remove('show');
 dialogText.style.color=L.color||'#ffffff';
 dialogText.innerHTML=''; cursorEl.style.visibility='hidden';
 words=L.text.trim().split(/\s+/); wi=0; typing=true; waiting=false;
 clearTimeout(typeTimer); clearTimeout(autoTimer);
 typeTimer=setTimeout(stepWord,260);
}
function stepWord(){
 if(!playing||!typing) return;
 pushWord(words[wi]); blip(); wi++;
 if(wi<words.length) typeTimer=setTimeout(stepWord,wordDelay());
 else finishLine();
}
function finishLine(){
 typing=false; waiting=true; cursorEl.style.visibility='visible';
 if(state.autoNext) autoTimer=setTimeout(advance,2000);
}
function revealAll(){
 clearTimeout(typeTimer);
 while(wi<words.length){ pushWord(words[wi]); wi++; }
 finishLine();
}
function advance(){
 if(!playing) return;
 clearTimeout(autoTimer);
 if(typing){ revealAll(); return; }
 if(waiting){ waiting=false; cursorEl.style.visibility='hidden'; nextLine(); return; }
 if(ended) stopPlay();
}
function endStory(){
 typing=false; waiting=false; ended=true;
 picWindow.classList.remove('show'); dialogText.innerHTML='';
 endCard.classList.add('show');
}
function stopPlay(){
 playing=false; typing=false; waiting=false; ended=false;
 clearTimeout(typeTimer); clearTimeout(autoTimer);
 document.body.classList.remove('playing');
 playBtn.textContent='\u25B6 PLAY STORY';
 audio.pause(); endCard.classList.remove('show');
 dialogText.innerHTML=''; picWindow.classList.remove('show'); cursorEl.style.visibility='hidden';
 requestAnimationFrame(fitStage);
}
playBtn.addEventListener('click',function(){ if(playing) stopPlay(); else startPlay(); });
stage.addEventListener('click',function(){ if(playing) advance(); });
document.addEventListener('keydown',function(e){
 if(!playing) return;
 if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); advance(); }
 else if(e.code==='Escape') stopPlay();
});

/* ---------- init ---------- */
renderLines(); renderImages(); updateBgUI(); refreshStatus(); fitStage();
statusBar.textContent+=' - READY';
})();
</script>
</body>
